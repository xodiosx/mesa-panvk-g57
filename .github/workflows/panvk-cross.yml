name: Build PanVK for Winlator (aarch64, cross-compile via Android NDK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout (for sigbus.patch)
        uses: actions/checkout@v4

      - name: Verify sigbus.patch exists at repo root
        run: |
          set -euo pipefail
          PATCH="${{ github.workspace }}/sigbus.patch"
          [[ -f "$PATCH" ]] || { echo "ERROR: $PATCH not found"; ls -la "${{ github.workspace }}"; exit 1; }
          ls -lh "$PATCH"
          head -n 30 "$PATCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential llvm-18-dev libclang-18-dev libclc-18-dev \
              libllvmspirvlib-18-dev libelf-dev spirv-tools bison flex \
              libdrm-dev libx11-dev libx11-xcb-dev libxcb1-dev \
              libxcb-randr0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
              libxcb-present-dev libxcb-shm0-dev libxcb-sync-dev \
              libxcb-xfixes0-dev libxcb-keysyms1-dev libxcb-shape0-dev \
              libxcb-render0-dev libxcb-render-util0-dev libxcb-xkb-dev \
              libxcb-icccm4-dev libxcb-image0-dev libxcb-util0-dev \
              libxrandr-dev libxshmfence-dev pkg-config ninja-build \
              patch gettext
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Clone mesa-panvk-g57 and apply sigbus.patch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf mesa-src
          git clone --depth 1 https://github.com/xodiosx/mesa-panvk-g57.git mesa-src
          cd mesa-src
          if git apply --verbose "$GITHUB_WORKSPACE/sigbus.patch"; then
            echo ">>> git apply succeeded"
          else
            patch -p1 --batch --forward < "$GITHUB_WORKSPACE/sigbus.patch"
          fi
          git --no-pager diff --stat || true
          sed -i \
            's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' \
            src/util/anon_file.c || true

      - name: Patch vendored vk_android_native_buffer.h
        working-directory: mesa-src
        run: |
          set -euo pipefail
          FILE="include/vulkan/vk_android_native_buffer.h"
          [[ -f "$FILE" ]] || { echo "ERROR: $FILE missing"; exit 1; }
          sed -i -E \
            's|^([[:space:]]*)typedef[[:space:]]+void[[:space:]]*\*[[:space:]]*buffer_handle_t[[:space:]]*;.*$|\1#include <cutils/native_handle.h>|' \
            "$FILE"
          grep -q 'cutils/native_handle.h' "$FILE" || { echo "ERROR: patch failed"; exit 1; }
          echo "OK: patched"

      - name: Fetch prebuilt shims from mesa-funnymdzz
        run: |
          set -euo pipefail
          git clone --depth 1 --branch panvk-jm \
            https://github.com/Mateus-tokokudo/mesa-funnymdzz.git \
            /tmp/funnymdzz
          SHIMS_SRC="$GITHUB_WORKSPACE/mesa-src/shims"
          rm -rf "$SHIMS_SRC"
          cp -r /tmp/funnymdzz/shims "$SHIMS_SRC"

          echo "==== shims contents ===="
          ls -la "$SHIMS_SRC"
          echo "==== .so / .a files ===="
          find "$SHIMS_SRC" -name '*.so' -o -name '*.a' | sort || true
          echo "==== .pc files ===="
          find "$SHIMS_SRC" -name '*.pc' | sort || true
          echo "==== include dir ===="
          find "$SHIMS_SRC" -maxdepth 3 -type d | sort || true

          # Snapshot the shims into a zip at the workspace root, in a
          # location that survives even if the build fails later.
          cd "$GITHUB_WORKSPACE"
          rm -f shims.zip
          ( cd mesa-src && zip -r ../shims.zip shims )
          ls -lh "$GITHUB_WORKSPACE/shims.zip"

      # ── Guarantee the shims zip uploads even if the build dies ──
      - name: Upload shims.zip artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shims-zip-${{ needs.prepare.outputs.stamp }}
          path: ${{ github.workspace }}/shims.zip
          if-no-files-found: warn

      - name: Build host tools
        working-directory: mesa-src
        run: |
          set -euo pipefail
          meson setup build-host \
              -Dplatforms=[] -Dgallium-drivers=[] -Dvulkan-drivers=[] \
              -Dtools=panfrost -Dprecomp-compiler=enabled \
              -Dinstall-precomp-compiler=true -Dllvm=enabled \
              -Dmesa-clc=enabled -Dinstall-mesa-clc=true
          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile
          ln -sf "build-host/src/compiler/clc/mesa_clc"       "build-host/src/compiler/clc/mesa-clc"
          ln -sf "build-host/src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"
          ln -sf "build-host/src/panfrost/clc/panfrost_compile" \
                 "build-host/src/compiler/spirv/panfrost-compile"

      - name: Generate Android cross file
        working-directory: mesa-src
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_NDK_LATEST_HOME:-}" && -d "$ANDROID_NDK_LATEST_HOME" ]]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          else
            NDK="/usr/local/lib/android/sdk/ndk/$(ls /usr/local/lib/android/sdk/ndk 2>/dev/null | sort -V | tail -1)"
          fi
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          MESON_WORKING_DIR="$GITHUB_WORKSPACE/mesa-src"
          export MESON_WORKING_DIR ANDROID_NDK_HOME="$NDK"
          API=30

          cat > android.toml <<EOF
          [binaries]
          c         = '${TOOLCHAIN}/bin/aarch64-linux-android${API}-clang'
          cpp       = '${TOOLCHAIN}/bin/aarch64-linux-android${API}-clang++'
          ar        = '${TOOLCHAIN}/bin/llvm-ar'
          strip     = '${TOOLCHAIN}/bin/llvm-strip'
          ld        = '${TOOLCHAIN}/bin/ld.lld'
          pkgconfig = '/usr/bin/pkg-config'

          [host_machine]
          system     = 'android'
          cpu_family = 'aarch64'
          cpu        = 'aarch64'
          endian     = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args        = ['-I${MESON_WORKING_DIR}/shims/include']
          cpp_args      = ['-I${MESON_WORKING_DIR}/shims/include']
          c_link_args   = ['-L${MESON_WORKING_DIR}/shims', '-Wl,--allow-shlib-undefined']
          cpp_link_args = ['-L${MESON_WORKING_DIR}/shims', '-Wl,--allow-shlib-undefined']
          EOF

          envsubst < android.toml > /tmp/android_wrapper.toml
          echo "==== /tmp/android_wrapper.toml ===="
          cat /tmp/android_wrapper.toml

      - name: Configure meson
        working-directory: mesa-src
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/mesa-src/shims
        run: |
          set -euo pipefail
          MESON_WORKING_DIR="$GITHUB_WORKSPACE/mesa-src"
          export PATH="$MESON_WORKING_DIR/build-host/src/compiler/clc:$MESON_WORKING_DIR/build-host/src/compiler/spirv:$MESON_WORKING_DIR/build-host/src/panfrost/clc:$PATH"

          rm -rf build

          meson setup build \
              --cross-file /tmp/android_wrapper.toml \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android,x11 \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled \
              -Dstrip=false \
              -Dpanfrost-kmds=kbase,panthor

      - name: Verify include + link paths
        working-directory: mesa-src
        run: |
          set -euo pipefail
          grep -q "$GITHUB_WORKSPACE/mesa-src/shims" build/build.ninja \
            || { echo "ERROR: shims path missing from build.ninja"; exit 1; }
          echo "OK: shims path present"

      - name: Compile libvulkan_panfrost.so
        working-directory: mesa-src
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/mesa-src/shims
          LIBRARY_PATH: ${{ github.workspace }}/mesa-src/shims
        run: |
          set -euo pipefail
          MESON_WORKING_DIR="$GITHUB_WORKSPACE/mesa-src"
          export PATH="$MESON_WORKING_DIR/build-host/src/compiler/clc:$MESON_WORKING_DIR/build-host/src/compiler/spirv:$MESON_WORKING_DIR/build-host/src/panfrost/clc:$PATH"
          ninja -C build src/panfrost/vulkan/libvulkan_panfrost.so

      - name: Package tarball (${{ matrix.build-type }})
        if: success()
        run: |
          set -euo pipefail
          OUT="winlator-out-${{ matrix.build-type }}"
          mkdir -p "$OUT/lib" "$OUT/share/vulkan/icd.d"
          cp mesa-src/build/src/panfrost/vulkan/libvulkan_panfrost.so "$OUT/lib/"
          cat > "$OUT/share/vulkan/icd.d/panfrost_icd.aarch64.json" <<'JSON'
          {
              "file_format_version": "1.0.1",
              "ICD": {
                  "library_path": "libvulkan_panfrost.so",
                  "api_version": "1.4.354",
                  "library_arch": "64"
              }
          }
          JSON
          TARBALL="panvk-winlator-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "$TARBALL" -C "$OUT" .
          ls -lh "$TARBALL"

      - name: Upload build artifact (only on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-winlator-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: |
            winlator-out-${{ matrix.build-type }}/
            panvk-winlator-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    # Run even if the build job failed — we still want to publish the shims.
    if: always()
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f 2>/dev/null || true

      - name: Collect files for release
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-files

          # Always include the shims zip if it made it back.
          if compgen -G "artifacts/shims.zip" >/dev/null; then
            cp artifacts/shims.zip release-files/
            echo "shims_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "shims_ok=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: shims.zip not found in artifacts"
          fi

          # Include any build tarballs / drivers if the build succeeded.
          find artifacts -name 'panvk-winlator-aarch64-*.tar.gz' -exec cp {} release-files/ \; || true
          find artifacts -name 'libvulkan_panfrost.so'           -exec cp {} release-files/ \; || true
          find artifacts -name 'panfrost_icd.aarch64.json'       -exec cp {} release-files/ \; || true

          echo "==== release-files ===="
          ls -la release-files

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          BUILD_OK="yes"
          if ! compgen -G "release-files/panvk-winlator-aarch64-*.tar.gz" >/dev/null; then
            BUILD_OK="no"
          fi

          cat > notes.md <<EOF
          ## PanVK for Winlator (aarch64, cross-compile via Android NDK)

          **Build date (UTC):** \`${{ needs.prepare.outputs.date }}\`
          **Build time (UTC):** \`${{ needs.prepare.outputs.time }}\`
          **Commit:** \`${{ github.sha }}\`
          **Requested build types:** \`${{ needs.prepare.outputs.types }}\`
          **Build succeeded:** \`${BUILD_OK}\`

          ### Files
          - \`shims.zip\` — prebuilt pkg-config shims + stub \`.so\`/\`.a\`
            archives + headers. Extracted from
            \`Mateus-tokokudo/mesa-funnymdzz@panvk-jm\`. Reusable for any
            future cross-compile run.
          EOF

          if [[ "$BUILD_OK" == "yes" ]]; then
            cat >> notes.md <<'EOF'
          - `panvk-winlator-aarch64-debugoptimized-*.tar.gz`
          - `panvk-winlator-aarch64-release-*.tar.gz`
          - `libvulkan_panfrost.so` — Vulkan driver
          - `panfrost_icd.aarch64.json` — ICD manifest

          ### Install (Winlator / Android container)
          ```bash
          tar -xzf panvk-winlator-aarch64-release-*.tar.gz -C /path/to/rootfs
          export VK_ICD_FILENAMES=/path/to/rootfs/share/vulkan/icd.d/panfrost_icd.aarch64.json
          export LD_LIBRARY_PATH=/path/to/rootfs/lib:$LD_LIBRARY_PATH
          ```
          EOF
          fi

          echo "==== notes ===="
          cat notes.md

      - name: Create GitHub Release
        # Only create the release if we have at least one file to attach.
        if: hashFiles('release-files/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — PanVK Winlator build ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body_path: notes.md
          files: release-files/*
          fail_on_unmatched_files: false
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
