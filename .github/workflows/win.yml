name: Build PanVK hybrid

on:
  workflow_dispatch:
    inputs:
      apply_patches:
        description: 'Apply extra PanVK/AHB patches on top (uncheck to build as-is)'
        type: boolean
        required: true
        default: false
      build_zink:
        description: 'Also build the Mesa GL stack (EGL/GLES + Zink in libgallium_dri.so)'
        type: boolean
        required: true
        default: false
      tag:
        description: 'Release tag to create or update'
        required: true
        default: 'panvk-hyb'
      api_override:
        description: 'Vulkan API override (leave empty to keep as-is)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      NDK_VERSION: 'r28c'
      ANDROID_API: '33'
      CACHE_FILE: 'ci-cache/host-tools.tar.gz'
      APPLY_PATCHES: ${{ github.event.inputs.apply_patches }}
      BUILD_ZINK: ${{ github.event.inputs.build_zink }}

      BASE_BRANCH: main
      REFERENCE_BRANCH: winlator-pan
      OUTPUT_BRANCH: winlator-2

    steps:
      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake pkgconf bison flex ripgrep \
            clang-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev \
            libclc-19 libclc-19-dev libllvmspirvlib-19-dev \
            libdrm-dev zlib1g-dev \
            patchelf curl ca-certificates zip wget
          python3 -m venv .ci-python
          .ci-python/bin/pip install \
            meson==1.8.3 Mako==1.3.10 packaging==25.0 PyYAML==6.0.2 ply==3.11
          echo "$GITHUB_WORKSPACE/.ci-python/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Download Android NDK ${NDK_VERSION}
        run: |
          set -euo pipefail
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q "${NDK_ZIP}" -d /opt
          echo "PANVK_NDK=/opt/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          test -x "/opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"

      # =====================================================================
      # PREPARATION
      # =====================================================================
      - name: Checkout base branch (main) into mesa/
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          path: mesa
          fetch-depth: 0

      - name: Checkout reference branch (winlator-pan) into reference/
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REFERENCE_BRANCH }}
          path: reference
          fetch-depth: 1

      - name: Compute diff main..winlator-pan
        working-directory: mesa
        run: |
          set -euo pipefail
          git fetch origin "${{ env.REFERENCE_BRANCH }}:refs/remotes/origin/${{ env.REFERENCE_BRANCH }}"
          git --no-pager diff --stat "${{ env.BASE_BRANCH }}..origin/${{ env.REFERENCE_BRANCH }}" || true
          git --no-pager diff "${{ env.BASE_BRANCH }}..origin/${{ env.REFERENCE_BRANCH }}" \
            > "$GITHUB_WORKSPACE/winlator-pan.patch"
          wc -l "$GITHUB_WORKSPACE/winlator-pan.patch"

      - name: Create winlator-2 (main + AHB from winlator-pan + fixes)
        working-directory: mesa
        run: |
          set -euo pipefail

          git checkout -B "${{ env.OUTPUT_BRANCH }}" "${{ env.BASE_BRANCH }}"

          KEEP_PATHS=(
            "include/vulkan/vk_android_native_buffer.h"
            "src/android_stub"
            "src/panfrost"
            "src/vulkan/runtime"
            "src/vulkan/wsi"
            "src/vulkan/meson.build"
            "src/gallium/drivers/panfrost"
            "src/gallium/drivers/zink"
            "src/util/u_gralloc"
            "src/util/meson.build"
            "meson.build"
            "meson.options"
          )

          RESTORE_FROM_MAIN=(
            "src/panfrost/vulkan/panvk_physical_device.c"
            "src/panfrost/vulkan/panvk_physical_device.h"
          )

          for p in "${KEEP_PATHS[@]}"; do
            if git cat-file -e "origin/${{ env.REFERENCE_BRANCH }}:$p" 2>/dev/null; then
              git checkout "origin/${{ env.REFERENCE_BRANCH }}" -- "$p"
            fi
          done
          for p in "${RESTORE_FROM_MAIN[@]}"; do
            git checkout "${{ env.BASE_BRANCH }}" -- "$p"
          done

          echo "=== FIXUP 1: add host_import helpers to main panvk_physical_device.h ==="
          HDR="src/panfrost/vulkan/panvk_physical_device.h"
          python3 - "$HDR" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          if "panvk_host_import_enabled" in src:
              print("✔ already present"); sys.exit(0)
          if '#include <stdlib.h>' not in src:
              src = src.replace("#include <stdint.h>",
                                "#include <stdint.h>\n#include <stdlib.h>", 1)
          if '#include <string.h>' not in src:
              src = src.replace("#include <stdlib.h>",
                                "#include <stdlib.h>\n#include <string.h>", 1)
          if '#include "pan_props.h"' not in src:
              src = src.replace('#include "lib/kmod/pan_kmod.h"',
                                '#include "lib/kmod/pan_kmod.h"\n#include "pan_props.h"', 1)
          helpers = (
              "static inline bool\n"
              "panvk_host_import_enabled(const struct panvk_physical_device *device)\n"
              "{\n"
              "   const char *value = getenv(\"PANVK_TEST_HOST_IMPORT\");\n"
              "   return device->kbase_node_path[0] &&\n"
              "          pan_arch(device->kmod.dev->props.gpu_id) < 10 &&\n"
              "          (!value || strcmp(value, \"0\") != 0);\n"
              "}\n"
              "\n"
              "static inline uint32_t\n"
              "panvk_host_import_memory_types(const struct panvk_physical_device *device)\n"
              "{\n"
              "   uint32_t bits = 0;\n"
              "   for (uint32_t i = 0; i < device->memory.type_count; i++)\n"
              "      if (device->memory.types[i].propertyFlags &\n"
              "          VK_MEMORY_PROPERTY_HOST_VISIBLE_BIT)\n"
              "         bits |= 1u << i;\n"
              "   return bits;\n"
              "}\n\n"
          )
          anchor = "void panvk_physical_device_finish(struct panvk_physical_device *device);"
          src = src.replace(anchor, helpers + anchor, 1)
          open(p, "w", encoding="utf-8").write(src)
          print("✔ inserted helpers")
          PY

          echo "=== FIXUP 2: 2-arg pan_query_core_count in main panvk_physical_device.c ==="
          CDOT="src/panfrost/vulkan/panvk_physical_device.c"
          python3 - "$CDOT" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          n = src.count("pan_query_core_count(&device->kmod.dev->props)")
          src = src.replace("pan_query_core_count(&device->kmod.dev->props)",
                            "pan_query_core_count(&device->kmod.dev->props, NULL)")
          open(p, "w", encoding="utf-8").write(src)
          print(f"✔ patched {n} call site(s)")
          PY

          # -------------------------------------------------------------
          # FIXUP 3 (Zink-only): gallium/drivers/zink was overlaid from
          # winlator-pan. Its meson.build must not clash with the fact
          # that our build has -Dgallium-drivers=zink or =. It self-
          # gates; nothing to do here. But the top-level meson.build
          # that came from winlator-pan may set certain defaults we do
          # not want; leave as-is and let -D flags override.
          # -------------------------------------------------------------

          git add -A
          if git diff --cached --quiet; then
            echo "⚠️  no changes"
          else
            git -c user.email="github-actions@users.noreply.github.com" \
                -c user.name="github-actions" \
                commit -m "ci: winlator-2 merge ($(date -u +%Y%m%d-%H%M%S))"
          fi

      - name: Push winlator-2 to origin
        working-directory: mesa
        run: |
          set -euo pipefail
          git push origin "${{ env.OUTPUT_BRANCH }}" --force
          echo "✔ pushed ${{ env.OUTPUT_BRANCH }}"

      - name: Save diff patch as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-pan.diff
          path: winlator-pan.patch
          if-no-files-found: warn

      # =====================================================================
      # HOST-TOOLS CACHE
      # =====================================================================
      - name: Checkout cache repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: ci-repo
          fetch-depth: 1
          token: ${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Try restore host-tools from cache repo
        id: cache
        run: |
          set -euo pipefail
          FILE="$GITHUB_WORKSPACE/ci-repo/${{ env.CACHE_FILE }}"
          if [ -f "$FILE" ]; then
            echo "✔ cache found: $FILE"
            tar -xzf "$FILE" -C "$GITHUB_WORKSPACE"
            chmod -R +x "$GITHUB_WORKSPACE/host-bin" 2>/dev/null || true
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ no cache"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export HOST_DEPS + PATH (cache hit)
        if: steps.cache.outputs.hit == 'true'
        run: |
          echo "HOST_DEPS=$GITHUB_WORKSPACE/spirv-host/prefix" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/host-bin" >> "$GITHUB_PATH"

      - name: Build SPIRV-Tools (host)
        if: steps.cache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          SDK_TAG=vulkan-sdk-1.4.309.0
          WORK="$GITHUB_WORKSPACE/spirv-host"
          HOST_DEPS="$WORK/prefix"
          mkdir -p "$WORK"
          git clone --depth 1 --branch "$SDK_TAG" \
            https://github.com/KhronosGroup/SPIRV-Tools.git "$WORK/SPIRV-Tools"
          git clone --depth 1 --branch "$SDK_TAG" \
            https://github.com/KhronosGroup/SPIRV-Headers.git \
            "$WORK/SPIRV-Tools/external/spirv-headers"
          cmake -S "$WORK/SPIRV-Tools" -B "$WORK/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOST_DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build "$WORK/build" --parallel 2
          cmake --install "$WORK/build"
          echo "HOST_DEPS=$HOST_DEPS" >> "$GITHUB_ENV"

      - name: Configure host tools
        if: steps.cache.outputs.hit != 'true'
        working-directory: mesa
        env:
          CC: clang-19
          CXX: clang++-19
          LLVM_CONFIG: /usr/lib/llvm-19/bin/llvm-config
          PKG_CONFIG_PATH: ${{ env.HOST_DEPS }}/lib/pkgconfig:/usr/lib/llvm-19/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.HOST_DEPS }}/lib
        run: |
          meson setup build-host \
            --buildtype=release -Dbuild-tests=false \
            -Dplatforms=[] -Dgallium-drivers=[] -Dvulkan-drivers=[] \
            -Dtools=panfrost -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true -Dllvm=enabled \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true

      - name: Build host tools
        if: steps.cache.outputs.hit != 'true'
        working-directory: mesa
        env:
          CC: clang-19
          CXX: clang++-19
          LLVM_CONFIG: /usr/lib/llvm-19/bin/llvm-config
          PKG_CONFIG_PATH: ${{ env.HOST_DEPS }}/lib/pkgconfig:/usr/lib/llvm-19/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.HOST_DEPS }}/lib
        run: |
          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile

      - name: Stage host tools
        if: steps.cache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/host-bin"
          for name in mesa_clc vtn_bindgen2 panfrost_compile; do
            bin=$(find "$GITHUB_WORKSPACE/mesa/build-host" -type f -executable -name "$name" | head -n1)
            [ -n "$bin" ] || { echo "❌ $name not found"; exit 1; }
            cp "$bin" "$GITHUB_WORKSPACE/host-bin/$name"
            cp "$bin" "$GITHUB_WORKSPACE/host-bin/$(echo "$name" | tr '_' '-')"
          done
          chmod -R +x "$GITHUB_WORKSPACE/host-bin"
          echo "$GITHUB_WORKSPACE/host-bin" >> "$GITHUB_PATH"
          echo "HOST_DEPS=$GITHUB_WORKSPACE/spirv-host/prefix" >> "$GITHUB_ENV"

      - name: Upload host-tools to cache repo
        if: steps.cache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p ci-repo/ci-cache
          tar -czf "ci-repo/${{ env.CACHE_FILE }}" spirv-host/prefix host-bin
          cd ci-repo
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name  "github-actions"
          git add "${{ env.CACHE_FILE }}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: cache host-tools ($(date -u +%Y%m%d-%H%M%S))"
          git push origin "HEAD:${{ github.ref_name }}" || echo "⚠️ push failed"

      # =====================================================================
      # EXTRA SOURCE PATCHES — gated on apply_patches
      # =====================================================================

      - name: PATCH 1 — Revert vk_android_native_buffer.h
        if: env.APPLY_PATCHES == 'true'
        working-directory: mesa
        run: |
          set -euo pipefail
          F="include/vulkan/vk_android_native_buffer.h"
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]; src = open(p, encoding="utf-8").read()
          lines = src.splitlines(keepends=True); patched = 0; out = []
          for line in lines:
              s = line.lstrip()
              if (patched == 0 and s.startswith("#if")
                      and "defined(__ANDROID__)" in line
                      and "defined(ANDROID)"    in line
                      and "&& 0"                in line):
                  indent = line[:len(line) - len(s)]
                  nl = "\n" if line.endswith("\n") else ""
                  out.append(f"{indent}#if defined(__ANDROID__) || defined(ANDROID){nl}")
                  patched += 1
              else:
                  out.append(line)
          if patched:
              open(p, "w", encoding="utf-8", newline="").write("".join(out))
          print(f"✔ reverted {patched} line(s)")
          PY

      - name: PATCH 2 — Force desktop vulkan.sym
        if: env.APPLY_PATCHES == 'true'
        working-directory: mesa
        run: |
          F="src/vulkan/meson.build"
          if grep -q "vulkan-android.sym" "$F"; then
            sed -i \
              -e 's/vulkan-icd-android-symbols\.txt/vulkan-icd-symbols.txt/g' \
              -e 's/vulkan-android\.sym/vulkan.sym/g' "$F"
            echo "✔ replaced scheme"
          else
            echo "✔ already desktop vulkan.sym"
          fi

      - name: PATCH 3 — Honest hw_get_module() stub
        if: env.APPLY_PATCHES == 'true'
        working-directory: mesa
        run: |
          F="src/android_stub/hardware_stub.cpp"
          [ -f "$F" ] || { echo "not present"; exit 0; }
          grep -q "PATCH: honest stub" "$F" && exit 0
          cat > "$F" <<'EOF'
          extern "C" {
          struct hw_module_t;
          int hw_get_module(const char *id, const struct hw_module_t **module)
          { (void)id; *module = 0; return -1; }
          }
          EOF
          echo "✔ rewrote $F"

      - name: PATCH 4 — fd probe in vk_common_GetAndroidHardwareBufferPropertiesANDROID
        if: env.APPLY_PATCHES == 'true'
        working-directory: mesa
        run: |
          F="src/vulkan/runtime/vk_android.c"
          grep -q "PANVK_PATCHED_VK_ANDROID_FD_PROBE" "$F" && exit 0
          python3 - "$F" <<'PY'
          import re, sys
          p = sys.argv[1]; src = open(p, encoding="utf-8").read()
          pat = re.compile(r'pProperties->allocationSize\s*=\s*lseek\(\s*handle->data\[0\]\s*,\s*0\s*,\s*SEEK_END\s*\);')
          if not pat.search(src):
              print("⚠️  pattern not found"); sys.exit(0)
          src = pat.sub(
              "int dma_buf_fd = handle->data[0];\n"
              "   off_t dma_buf_size = lseek(dma_buf_fd, 0, SEEK_END);\n"
              "   if (dma_buf_size <= 0) {\n"
              "      for (int _i = 1; _i < handle->numFds; _i++) {\n"
              "         off_t _sz = lseek(handle->data[_i], 0, SEEK_END);\n"
              "         if (_sz > 0) { dma_buf_fd = handle->data[_i];\n"
              "                        dma_buf_size = _sz; break; }\n"
              "      }\n"
              "   }\n"
              "   pProperties->allocationSize = dma_buf_size;",
              src, count=1)
          src = src.replace(
              "VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT, handle->data[0],",
              "VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT, dma_buf_fd,", 1)
          open(p, "w", encoding="utf-8").write(src)
          print("✔ patched vk_android.c")
          PY

      - name: PATCH 5 — u_gralloc_panvk_test.h fd probing
        if: env.APPLY_PATCHES == 'true'
        working-directory: mesa
        run: |
          HDR="src/util/u_gralloc/u_gralloc_panvk_test.h"
          [ -f "$HDR" ] || { echo "not found"; exit 0; }
          grep -q "PANVK_PATCHED_FD_PROBE" "$HDR" && exit 0
          cat > "$HDR" <<'HDR_EOF'
          /* SPDX-License-Identifier: MIT */
          #ifndef U_GRALLOC_PANVK_TEST_H
          #define U_GRALLOC_PANVK_TEST_H
          #include <cutils/native_handle.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include "util/log.h"
          static inline int
          u_gralloc_panvk_test_fd(const native_handle_t *handle, const char *where)
          {
             if (!handle || handle->numFds < 1) return -1;
             int best_fd = -1; off_t best_size = 0;
             for (int i = 0; i < handle->numFds; i++) {
                int fd = handle->data[i];
                off_t size = lseek(fd, 0, SEEK_END);
                if (size <= 0) continue;
                if (size > best_size) { best_size = size; best_fd = fd; }
             }
             if (best_fd < 0) { mesa_loge("AHBFD %s: no valid dma-buf", where);
                                return handle->data[0]; }
             mesa_logi("AHBFD %s: selected fd=%d size=%lld",
                       where, best_fd, (long long)best_size);
             return best_fd;
          }
          #endif
          HDR_EOF
          echo "✔ rewrote $HDR"

      - name: PATCH 6 — Guard panvk_android_hal_bridge
        if: env.APPLY_PATCHES == 'true'
        working-directory: mesa
        run: |
          FILE="src/panfrost/vulkan/meson.build"
          python3 - "$FILE" <<'PY'
          import sys
          p = sys.argv[1]; src = open(p, encoding="utf-8").read()
          if "if not with_platform_android" in src and "panvk_android_hal_bridge" in src:
              print("already guarded"); sys.exit(0)
          old = "panvk_android_hal_bridge = files('panvk_android_hal_bridge.c')"
          if old not in src:
              print("pattern not found"); sys.exit(0)
          src = src.replace(old,
              "panvk_android_hal_bridge = []\n"
              "if not with_platform_android\n"
              "  panvk_android_hal_bridge = files('panvk_android_hal_bridge.c')\n"
              "endif", 1)
          open(p, "w", encoding="utf-8").write(src)
          print("✔ guarded")
          PY

      - name: Override Vulkan API version (optional)
        if: github.event.inputs.api_override != ''
        working-directory: mesa
        run: |
          VER="${{ github.event.inputs.api_override }}"
          DEVFILE="src/panfrost/vulkan/panvk_physical_device.c"
          sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${VER//\./_}/" "$DEVFILE" || true

      # =====================================================================
      # BUILD
      # =====================================================================
      - name: Create Meson cross file
        run: |
          set -euo pipefail
          NDK_BIN="$PANVK_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          EMPTY_PKGCONFIG="$(mktemp -d)"
          echo "PANVK_EMPTY_PKGCONFIG=$EMPTY_PKGCONFIG" >> "$GITHUB_ENV"
          cat > "$GITHUB_WORKSPACE/android-aarch64.ini" <<EOF
          [binaries]
          c = '${NDK_BIN}/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '${NDK_BIN}/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '${NDK_BIN}/llvm-ar'
          strip = '${NDK_BIN}/llvm-strip'
          pkg-config = '/usr/bin/pkgconf'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = ['${EMPTY_PKGCONFIG}']

          [built-in options]
          c_args = ['-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          cpp_args = ['-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          cpp_link_args = ['-static-libstdc++']
          pkg_config_path = []
          EOF
          cat "$GITHUB_WORKSPACE/android-aarch64.ini"

      # ---------------------------------------------------------------
      # When BUILD_ZINK=true we flip three things compared to the plain
      # PanVK-only build:
      #
      #   -Dgallium-drivers=zink         (compile Zink)
      #   -Dopengl=true -Dgles2=enabled  (build the GL APIs)
      #   -Degl=enabled                  (build libEGL / libEGL_mesa)
      #   + -Dshared-glapi=enabled
      #
      # Everything else stays as-is: same cross file, same -Dplatforms,
      # same kbase/panthor, same zlib/zstd off.
      # ---------------------------------------------------------------
      - name: Configure PanVK + optional Zink (Android)
        working-directory: mesa
        run: |
          rm -rf build-android

          COMMON=(
            --buildtype=release -Dbuild-tests=false
            -Dplatforms=android -Dplatform-sdk-version="$ANDROID_API"
            -Dandroid-stub=true -Dandroid-libbacktrace=disabled
            -Dandroid-libperfetto=disabled
            -Dvulkan-drivers=panfrost
            -Dpanfrost-kmds=kbase,panthor -Dpanvk-use-kbase=true
            -Dpanfrost-rust=false -Dllvm=disabled
            -Dmesa-clc=system -Dprecomp-compiler=system
            -Dspirv-tools=disabled
            -Dglx=disabled -Dgbm=disabled
            -Dshader-cache=disabled -Dxmlconfig=disabled -Dexpat=disabled
            -Dlibunwind=disabled -Dvalgrind=disabled
            -Dzlib=disabled -Dzstd=disabled
            -Dvideo-codecs= -Dperfetto=false -Dstrip=true -Dcpp_rtti=false
            --force-fallback-for=libdrm -Dallow-fallback-for=libdrm
            -Dlibdrm:default_library=static
          )

          if [ "${BUILD_ZINK}" = "true" ]; then
            echo ">>> BUILD_ZINK=true — enabling Zink + EGL/GLES"
            PKG_CONFIG_PATH= meson setup build-android \
              --cross-file "$GITHUB_WORKSPACE/android-aarch64.ini" \
              "${COMMON[@]}" \
              -Dgallium-drivers=zink \
              -Dopengl=true -Dgles2=enabled -Dgles1=disabled \
              -Degl=enabled \
              -Dshared-glapi=enabled
          else
            echo ">>> BUILD_ZINK=false — PanVK-only build"
            PKG_CONFIG_PATH= meson setup build-android \
              --cross-file "$GITHUB_WORKSPACE/android-aarch64.ini" \
              "${COMMON[@]}" \
              -Dgallium-drivers= \
              -Dopengl=false -Dgles2=disabled -Dgles1=disabled \
              -Degl=disabled
          fi

      - name: Build PanVK (+ Zink)
        working-directory: mesa
        env:
          PATH: ${{ github.workspace }}/host-bin:/usr/lib/llvm-19/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          LD_LIBRARY_PATH: ${{ env.HOST_DEPS }}/lib
        run: |
          set -euo pipefail

          TARGETS="vulkan_panfrost"

          if [ "${BUILD_ZINK}" = "true" ]; then
            echo ">>> adding Zink + GL targets"
            TARGETS="$TARGETS gallium_dri"
            # libEGL / libGLESv2 / libglapi live under specific target names;
            # try each and ignore misses so older trees still build.
            EXTRA_EGL="libEGL libEGL_mesa libGLESv2 shared-glapi glapi"
          fi

          echo ">>> building: $TARGETS"
          meson compile -C build-android -j 2 $TARGETS

          if [ "${BUILD_ZINK}" = "true" ]; then
            echo ">>> attempting additional GL targets (best effort)"
            for t in $EXTRA_EGL; do
              echo "--- trying target: $t ---"
              meson compile -C build-android -j 2 "$t" || echo "  (target $t not present, skipping)"
            done
          fi

          echo
          echo "==== panvk .so ===="
          SO=$(find build-android -name 'libvulkan_panfrost.so' -print -quit)
          [ -n "$SO" ] || { echo "❌ libvulkan_panfrost.so not found"; exit 1; }
          REAL=$(readlink -f "$SO")
          echo "✔ $REAL"
          ls -la "$REAL"
          echo "PANVK_SO=$REAL" >> "$GITHUB_ENV"

          if [ "${BUILD_ZINK}" = "true" ]; then
            echo
            echo "==== Zink-related artifacts found in build tree ===="
            find build-android \
              \( -name 'libgallium_dri.so' \
                 -o -name 'libEGL.so' -o -name 'libEGL_mesa.so' \
                 -o -name 'libGLESv2.so' -o -name 'libGLESv1_CM.so' \
                 -o -name 'libglapi.so' \) \
              -type f -print || true
          fi

      - name: Verify driver
        run: |
          set -euo pipefail
          SO="$PANVK_SO"
          echo "==== DT_NEEDED ===="
          readelf -d "$SO" | grep NEEDED || true
          echo
          echo "==== vk_icdGetInstanceProcAddr ===="
          nm -D "$SO" 2>/dev/null | grep -i 'vk_icdGetInstanceProcAddr' || echo "❌ not exported"
          echo
          echo "==== AHBFD strings ===="
          strings "$SO" | grep -i AHBFD || echo "(none)"
          echo
          echo "==== PANVKDBG count ===="
          strings "$SO" | grep -c PANVKDBG || true

          if [ "${BUILD_ZINK}" = "true" ]; then
            echo
            echo "==== Zink: check libgallium_dri.so has the zink driver ===="
            DRI=$(find mesa/build-android -name 'libgallium_dri.so' -type f -print -quit)
            if [ -n "$DRI" ]; then
              echo "  found: $DRI"
              strings "$DRI" | grep -i zink | head -5 || echo "  (no zink strings — check build flags)"
            else
              echo "  ⚠️  libgallium_dri.so not produced"
            fi
          fi

      # =====================================================================
      # PACKAGE — AdrenoTools ZIP (Vulkan driver only)
      # =====================================================================
      - name: Package AdrenoTools driver ZIP
        run: |
          set -euo pipefail
          SO="$PANVK_SO"
          [ -f "$SO" ] || { echo "❌ $SO not found"; exit 1; }
          [ -f mesa/meta.json ] || { echo "❌ meta.json missing"; exit 1; }

          if [ "${APPLY_PATCHES}" = "true" ]; then SUFFIX="patched"; else SUFFIX="winlator2"; fi
          OUT_NAME="panvcake_${SUFFIX}_26.3.0.R2.zip"
          STAGE="adreno-driver"
          rm -rf "$STAGE"; mkdir -p "$STAGE"

          ${PANVK_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            --strip-unneeded -o "$STAGE/libvulkan_panfrost.so" "$SO"
          cp mesa/meta.json "$STAGE/meta.json"

          ( cd "$STAGE" && zip -9 "../${OUT_NAME}" meta.json libvulkan_panfrost.so )
          unzip -l "${OUT_NAME}"

      # =====================================================================
      # PACKAGE — Mesa GL stack (Zink, EGL, GLES, glapi, gallium)
      #
      # This is what Winlator/Wine loads for OpenGL apps to reach Zink.
      # It ships as a plain .tar.gz — the user extracts it into the same
      # location as Winlator's existing Mesa GL libs.
      # =====================================================================
      - name: Package Mesa GL stack (Zink) — only when BUILD_ZINK=true
        if: env.BUILD_ZINK == 'true'
        run: |
          set -euo pipefail
          cd mesa

          STAGE="$GITHUB_WORKSPACE/gl-stack"
          rm -rf "$STAGE"; mkdir -p "$STAGE/lib" "$STAGE/share/vulkan/icd.d"

          # Copy whatever Mesa GL libs the build produced.
          FOUND=0
          for name in libgallium_dri.so \
                      libEGL.so libEGL.so.1 libEGL_mesa.so \
                      libGLESv2.so libGLESv2.so.2 \
                      libGLESv1_CM.so libGLESv1_CM.so.1 \
                      libglapi.so libglapi.so.0 \
                      libvulkan_panfrost.so; do
            f=$(find build-android -name "$name" -type f -print -quit || true)
            if [ -n "$f" ]; then
              cp -a "$f" "$STAGE/lib/"
              FOUND=$((FOUND+1))
              echo "  + $name"
            fi
          done

          if [ "$FOUND" = "0" ]; then
            echo "❌ no GL libs found in build-android"
            find build-android -name '*.so' -print | sort | head -40
            exit 1
          fi

          # Symlinks that Android loaders may look for.
          ( cd "$STAGE/lib"
            [ -f libEGL.so.1 ] && ln -sf libEGL.so.1 libEGL.so || true
            [ -f libGLESv2.so.2 ] && ln -sf libGLESv2.so.2 libGLESv2.so || true
            [ -f libGLESv1_CM.so.1 ] && ln -sf libGLESv1_CM.so.1 libGLESv1_CM.so || true
            [ -f libglapi.so.0 ] && ln -sf libglapi.so.0 libglapi.so || true
            true
          )

          # ICD manifest for the bundled Vulkan driver.
          cp "$PANVK_SO" "$STAGE/lib/libvulkan_panfrost.so" 2>/dev/null || true
          cat > "$STAGE/share/vulkan/icd.d/panfrost_icd.aarch64.json" <<EOF
          {
              "file_format_version": "1.0.1",
              "ICD": {
                  "api_version": "1.4.354",
                  "library_arch": "64",
                  "library_path": "libvulkan_panfrost.so"
              }
          }
          EOF

          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          OUT="$GITHUB_WORKSPACE/panvk-zink-glstack-aarch64-${STAMP}.tar.gz"
          tar -czf "$OUT" -C "$STAGE" .
          ls -lh "$OUT"
          echo "GLSTACK_OUT=$OUT" >> "$GITHUB_ENV"

          echo
          echo "==== gl-stack/lib contents ===="
          ls -la "$STAGE/lib/"

      # =====================================================================
      # UPLOAD / RELEASE
      # =====================================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-build-logs-${{ env.APPLY_PATCHES }}-zink${{ env.BUILD_ZINK }}
          path: |
            mesa/build-android/meson-logs/
            mesa/build-host/meson-logs/
          if-no-files-found: ignore

      - name: Upload AdrenoTools ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: panVK-G57-driver-zip-${{ env.APPLY_PATCHES }}
          path: panvcake_*.zip
          if-no-files-found: error

      - name: Upload GL stack
        if: success() && env.BUILD_ZINK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: panVK-G57-glstack-zink
          path: panvk-zink-glstack-aarch64-*.tar.gz
          if-no-files-found: error

      - name: Upload release assets
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
            # PanVK `panvcake` driver for AdrenoTools

            ## Build mode

            - `apply_patches`  = **${{ env.APPLY_PATCHES }}**
            - `build_zink`     = **${{ env.BUILD_ZINK }}**
            - Source branch    : `${{ env.OUTPUT_BRANCH }}`

            ## What's in the release

            **Always**: `panvcake_*.zip` — the AdrenoTools ZIP with the Vulkan
            driver only. Import via AdrenoTools, select it for your container.

            **When `build_zink=true`**: additionally a
            `panvk-zink-glstack-aarch64-*.tar.gz` containing:

            - `libvulkan_panfrost.so` — the same Vulkan ICD
            - `libgallium_dri.so` — the Gallium loader with Zink compiled in
            - `libEGL.so` / `libEGL_mesa.so` — Mesa EGL
            - `libGLESv2.so` / `libGLESv1_CM.so` — Mesa GLES
            - `libglapi.so` — GL dispatch
            - `share/vulkan/icd.d/panfrost_icd.aarch64.json` — ICD manifest

            ### How Zink works in Winlator

            Zink is a Gallium driver: it translates OpenGL/GLES into Vulkan.
            It is **not** part of `libvulkan_panfrost.so`. The AdrenoTools ZIP
            only supplies the Vulkan ICD. To use Zink, the environment needs
            the Mesa GL stack above:

            ```
            Wine opengl32.dll
              → libGLESv2.so / libEGL.so
                 → libgallium_dri.so (Zink inside)
                    → libvulkan_panfrost.so  ← AdrenoTools ZIP
            ```

            ### Installing the GL stack

            Extract the `panvk-zink-glstack-aarch64-*.tar.gz` into the
            directory that Winlator uses for its Mesa GL libs (typically the
            same folder as its existing `libgallium_dri.so`). Keep the
            AdrenoTools ZIP installed separately — do not merge them.

            ### Running

            Vulkan apps: AdrenoTools handles it, no extra env needed.

            OpenGL apps (Zink):
            ```
            MESA_LOADER_DRIVER_OVERRIDE=zink
            GALLIUM_DRIVER=zink
            PANVK_TEST_AHB_LINEAR=1
            PANVK_TEST_AHB_FD1=1
            ```
          files: |
            panvcake_*.zip
            panvk-zink-glstack-aarch64-*.tar.gz
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
