name: sync winlator-pan from mexicanbr0auth/mesa-panvk-g57

on:
  workflow_dispatch:
  push:
    branches: [winlator-pan]

permissions:
  contents: write

jobs:
  sync:
    name: Mirror reference tree onto winlator-pan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_REPO:   "${{ github.repository }}"
      BASE_BRANCH: "winlator-pan"
      REF_REPO:    "mexicanbr0auth/mesa-panvk-g57"
      REF_BRANCH:  "winlatormali-ci"
    steps:
      # ──────────────────────────────────────────────────────────
      # 1) Checkout the base branch with push credentials.
      # ──────────────────────────────────────────────────────────
      - name: Checkout ${{ env.BASE_BRANCH }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          echo "==== remote ===="
          git remote -v
          echo "==== base HEAD ===="
          git --no-pager log -1 --oneline

      # ──────────────────────────────────────────────────────────
      # 2) Clone the reference fork. List branches first so we
      #    can see exactly what exists, then fall back through
      #    candidates if the preferred name is missing.
      # ──────────────────────────────────────────────────────────
      - name: Clone reference (${{ env.REF_REPO }})
        run: |
          set -euo pipefail
          REF_DIR=/tmp/ref
          rm -rf "$REF_DIR"

          echo "==== branches available in $REF_REPO ===="
          git ls-remote --heads "https://github.com/$REF_REPO.git" \
            | awk '{print "  " $2}' | sed 's|refs/heads/||' | sort

          echo
          echo "==== selecting reference branch (preferred: $REF_BRANCH) ===="
          CANDIDATES="$REF_BRANCH winlatormali-ci winlator-cl winlator main master"
          USED_REF=""
          for br in $CANDIDATES; do
            if git ls-remote --heads "https://github.com/$REF_REPO.git" \
                 "refs/heads/$br" 2>/dev/null | grep -q "refs/heads/$br"; then
              USED_REF="$br"
              echo ">>> matched candidate: $br"
              break
            fi
          done
          if [[ -z "$USED_REF" ]]; then
            USED_REF=$(git ls-remote --symref \
                         "https://github.com/$REF_REPO.git" HEAD 2>/dev/null \
                       | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
          fi
          [[ -n "$USED_REF" ]] || { echo "ERROR: no usable branch from $REF_REPO" >&2; exit 1; }
          echo "REF_BRANCH_USED=$USED_REF" >> "$GITHUB_ENV"

          echo
          echo "==== cloning $REF_REPO @ $USED_REF ===="
          git clone --depth 1 --branch "$USED_REF" \
            "https://github.com/$REF_REPO.git" "$REF_DIR"

          REF_COMMIT=$(git -C "$REF_DIR" rev-parse HEAD)
          echo "REF_COMMIT=$REF_COMMIT" >> "$GITHUB_ENV"
          echo "reference commit: $REF_COMMIT"

          # Strip .git so rsync / diff never walk into it.
          rm -rf "$REF_DIR/.git"

          echo
          echo "==== reference top-level ===="
          ls -A "$REF_DIR" | head -60

      # ──────────────────────────────────────────────────────────
      # 3) Generate a diff BEFORE mirroring, as a diagnostic
      #    artifact. Excludes match the mirror step:
      #      .git   .github   *.md
      # ──────────────────────────────────────────────────────────
      - name: Generate diff (base vs reference, pre-mirror)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diff-out"

          EXCLUDES=(
            --exclude=.git
            --exclude=.github
            --exclude='*.md'
          )

          echo "==== running diff ===="
          set +e
          diff -ruN "${EXCLUDES[@]}" \
            "$GITHUB_WORKSPACE" /tmp/ref \
            > "$GITHUB_WORKSPACE/diff-out/winlator-ref.patch"
          DIFF_RC=$?
          set -e
          echo "diff exit code: $DIFF_RC  (0=identical, 1=differences, 2=error)"

          ls -lh "$GITHUB_WORKSPACE/diff-out/winlator-ref.patch"

          echo
          echo "==== file-level summary ===="
          set +e
          diff -rq "${EXCLUDES[@]}" \
            "$GITHUB_WORKSPACE" /tmp/ref \
            > "$GITHUB_WORKSPACE/diff-out/winlator-ref-summary.txt" 2>&1
          set -e
          wc -l "$GITHUB_WORKSPACE/diff-out/winlator-ref-summary.txt"
          echo "---- first 60 lines ----"
          head -60 "$GITHUB_WORKSPACE/diff-out/winlator-ref-summary.txt" || true
          echo "------------------------"

          {
            echo "### Base repository"
            echo "- URL:    https://github.com/$BASE_REPO"
            echo "- Branch: $BASE_BRANCH"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "### Reference repository"
            echo "- URL:    https://github.com/$REF_REPO"
            echo "- Branch: $REF_BRANCH_USED"
            echo "- Commit: $REF_COMMIT"
            echo
            echo "### Diff direction"
            echo "\`- \` lines: present in base, absent in reference"
            echo "\`+ \` lines: present in reference, absent in base"
            echo
            echo "### Note"
            echo "This diff shows the state BEFORE mirroring. The mirror"
            echo "step that follows overwrites every non-excluded file in"
            echo "the base with the reference version, so after the push"
            echo "the only differences that remain are \`.github/\` and"
            echo "\`*.md\` files, which are excluded."
          } > "$GITHUB_WORKSPACE/diff-out/README.md"

          cat "$GITHUB_WORKSPACE/diff-out/README.md"

      # ──────────────────────────────────────────────────────────
      # 4) Mirror the reference tree onto the base.
      #    - `--delete` removes files present in base but not in ref,
      #      so the branch becomes a true mirror.
      #    - Excludes protect .github/, *.md, .git/.
      #    - backup-dir lets us list what was deleted for the log.
      # ──────────────────────────────────────────────────────────
      - name: Mirror reference tree onto base
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "=============================================="
          echo "Mirroring /tmp/ref -> $GITHUB_WORKSPACE"
          echo "Excludes: .git  .github  *.md"
          echo "=============================================="

          # Dry-run first, so the log shows exactly what will be
          # deleted before it happens.
          echo
          echo "==== dry run: files that would be deleted ===="
          rsync -a --delete --dry-run --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.md' \
            /tmp/ref/ "$GITHUB_WORKSPACE/" \
            | grep '^\*deleting' || echo "  (none)"

          echo
          echo "==== dry run: files that would be updated ===="
          rsync -a --delete --dry-run --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.md' \
            /tmp/ref/ "$GITHUB_WORKSPACE/" \
            | grep -v '^\*deleting' | head -40 || true

          echo
          echo "==== performing mirror ===="
          # Real run. --delete makes destination match source exactly
          # for non-excluded paths.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.md' \
            /tmp/ref/ "$GITHUB_WORKSPACE/"

          echo
          echo "==== workspace top-level after mirror ===="
          ls -A "$GITHUB_WORKSPACE" | head -60

          echo
          echo "==== sanity: critical files present? ===="
          MISSING=0
          for f in \
            src/vulkan/wsi/wsi_common_android.c \
            src/panfrost/vulkan/jm/panvk_vX_gpu_queue_kbase.h \
            src/util/u_gralloc/u_gralloc_panvk_test.h \
            .github/winlatormali/build.sh \
            .github/winlatormali/package.py \
            .github/workflows/winpan.yml \
            .github/workflows/clwinpan.yml
          do
            if [[ -f "$GITHUB_WORKSPACE/$f" ]]; then
              echo "  OK  $f"
            else
              echo "  MISSING  $f"
              MISSING=1
            fi
          done
          if [[ "$MISSING" -eq 1 ]]; then
            echo
            echo "WARNING: some critical files are missing after the mirror."
            echo "Source files should have come from the reference, and"
            echo ".github/ files should have been preserved by the excludes."
          fi

      # ──────────────────────────────────────────────────────────
      # 5) Upload the diff artifact. Runs regardless of whether the
      #    push later succeeds or fails.
      # ──────────────────────────────────────────────────────────
      - name: Upload diff patch (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlator-ref-diff-${{ github.run_number }}
          path: |
            diff-out/winlator-ref.patch
            diff-out/winlator-ref-summary.txt
            diff-out/README.md
          if-no-files-found: warn

      # ──────────────────────────────────────────────────────────
      # 6) Commit and force-push. Only pushes if something changed.
      #    .github/ is never staged so workflow files on the target
      #    branch are never modified by this job.
      # ──────────────────────────────────────────────────────────
      - name: Commit and force-push to ${{ env.BASE_BRANCH }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # Never stage CI-only scaffolding or generated artifacts.
          git add -A -- \
            ':(exclude).github' \
            ':(exclude)diff-out' \
            ':(exclude)*.md'

          if git diff --cached --quiet; then
            echo ">>> No changes to commit — base already matches reference."
            exit 0
          fi

          echo "---- staged summary ----"
          git diff --cached --stat | tail -60
          echo "------------------------"

          git commit -q -m "sync: mirror $REF_REPO@$REF_BRANCH_USED onto $BASE_BRANCH ($(date -u +%Y%m%d-%H%M%S))"
          git --no-pager log -1 --oneline

          echo
          echo ">>> force-pushing to origin/$BASE_BRANCH"
          git push --force origin "HEAD:refs/heads/$BASE_BRANCH"
          echo ">>> push done"
