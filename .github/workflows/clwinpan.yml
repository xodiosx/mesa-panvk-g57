name: sync winlator-pan from mexicanbr0auth/mesa-panvk-g57

on:
  workflow_dispatch:
  push:
    branches: [winlator-pan]

permissions:
  contents: write

jobs:
  sync:
    name: Sync base with winlatormali reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Base — the branch we sync INTO and push back to.
      BASE_REPO:   "${{ github.repository }}"
      BASE_BRANCH: "winlator-pan"

      # Reference — the winlatormali source we pull FROM.
      REF_REPO:   "mexicanbr0auth/mesa-panvk-g57"
      REF_BRANCH: "winlatormali-ci"
    steps:
      # ──────────────────────────────────────────────────────────
      # 1) Checkout the base branch with push credentials.
      # ──────────────────────────────────────────────────────────
      - name: Checkout ${{ env.BASE_BRANCH }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          echo "==== remote ===="
          git remote -v
          echo "==== base HEAD ===="
          git --no-pager log -1 --oneline

      # ──────────────────────────────────────────────────────────
      # 2) Clone the reference fork. List branches first so we
      #    can see exactly what exists, then fall back through
      #    candidates if the preferred name is missing.
      # ──────────────────────────────────────────────────────────
      - name: Clone reference (${{ env.REF_REPO }})
        run: |
          set -euo pipefail
          REF_DIR=/tmp/ref
          rm -rf "$REF_DIR"

          echo "==== branches available in $REF_REPO ===="
          git ls-remote --heads "https://github.com/$REF_REPO.git" \
            | awk '{print "  " $2}' | sed 's|refs/heads/||' | sort

          echo
          echo "==== selecting reference branch (preferred: $REF_BRANCH) ===="
          CANDIDATES="$REF_BRANCH winlatormali-ci winlator-cl winlator main master"
          USED_REF=""
          for br in $CANDIDATES; do
            if git ls-remote --heads "https://github.com/$REF_REPO.git" \
                 "refs/heads/$br" 2>/dev/null | grep -q "refs/heads/$br"; then
              USED_REF="$br"
              echo ">>> matched candidate: $br"
              break
            fi
          done
          if [[ -z "$USED_REF" ]]; then
            USED_REF=$(git ls-remote --symref \
                         "https://github.com/$REF_REPO.git" HEAD 2>/dev/null \
                       | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
          fi
          [[ -n "$USED_REF" ]] || { echo "ERROR: no usable branch from $REF_REPO" >&2; exit 1; }
          echo "REF_BRANCH_USED=$USED_REF" >> "$GITHUB_ENV"

          echo
          echo "==== cloning $REF_REPO @ $USED_REF ===="
          git clone --depth 1 --branch "$USED_REF" \
            "https://github.com/$REF_REPO.git" "$REF_DIR"

          REF_COMMIT=$(git -C "$REF_DIR" rev-parse HEAD)
          echo "REF_COMMIT=$REF_COMMIT" >> "$GITHUB_ENV"
          echo "reference commit: $REF_COMMIT"

          # Strip .git so diff / copy never walk into it.
          rm -rf "$REF_DIR/.git"

          echo
          echo "==== reference top-level ===="
          ls -A "$REF_DIR" | head -60

      # ──────────────────────────────────────────────────────────
      # 3) Diff BEFORE we copy anything. This is what gets
      #    uploaded as the artifact — it shows exactly what the
      #    reference has that the base does not (and vice versa).
      #    Excludes match what the sync will skip:
      #      .git   .github   *.md
      # ──────────────────────────────────────────────────────────
      - name: Generate diff (base vs reference, pre-copy)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diff-out"

          EXCLUDES=(
            --exclude=.git
            --exclude=.github
            --exclude='*.md'
          )

          echo "==== running diff ===="
          set +e
          diff -ruN "${EXCLUDES[@]}" \
            "$GITHUB_WORKSPACE" /tmp/ref \
            > "$GITHUB_WORKSPACE/diff-out/winlator-ref.patch"
          DIFF_RC=$?
          set -e
          echo "diff exit code: $DIFF_RC  (0=identical, 1=differences, 2=error)"

          ls -lh "$GITHUB_WORKSPACE/diff-out/winlator-ref.patch"

          echo
          echo "==== file-level summary ===="
          set +e
          diff -rq "${EXCLUDES[@]}" \
            "$GITHUB_WORKSPACE" /tmp/ref \
            > "$GITHUB_WORKSPACE/diff-out/winlator-ref-summary.txt" 2>&1
          set -e
          wc -l "$GITHUB_WORKSPACE/diff-out/winlator-ref-summary.txt"
          echo "---- first 60 lines ----"
          head -60 "$GITHUB_WORKSPACE/diff-out/winlator-ref-summary.txt" || true
          echo "------------------------"

          {
            echo "### Base repository"
            echo "- URL:    https://github.com/$BASE_REPO"
            echo "- Branch: $BASE_BRANCH"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "### Reference repository"
            echo "- URL:    https://github.com/$REF_REPO"
            echo "- Branch: $REF_BRANCH_USED"
            echo "- Commit: $REF_COMMIT"
            echo
            echo "### Diff direction"
            echo "\`- \` lines: present in base, absent in reference"
            echo "\`+ \` lines: present in reference, absent in base"
            echo
            echo "### Excludes"
            echo "\`.git\`  \`.github\`  \`*.md\`"
          } > "$GITHUB_WORKSPACE/diff-out/README.md"

          cat "$GITHUB_WORKSPACE/diff-out/README.md"

      # ──────────────────────────────────────────────────────────
      # 4) Copy every file/folder present in the reference that
      #    doesn't exist in the base yet. Files that already exist
      #    are left alone (the diff above shows their content
      #    differences but we don't touch them).
      #
      #    Excluded paths: .git, .github, *.md
      # ──────────────────────────────────────────────────────────
      - name: Copy missing files/folders from reference into base
        run: |
          set -euo pipefail

          is_excluded() {
            local rel="$1"
            case "$rel" in
              .git|.git/*)             return 0 ;;
              .github|.github/*)       return 0 ;;
              *.md)                    return 0 ;;
            esac
            return 1
          }

          cd /tmp/ref

          COUNT=0
          SKIPPED=0

          echo "=============================================="
          echo "Copying files present only in $REF_BRANCH_USED:"
          echo "=============================================="
          while IFS= read -r rel; do
            rel="${rel#./}"
            [[ -z "$rel" ]] && continue

            if is_excluded "$rel"; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            dest="$GITHUB_WORKSPACE/$rel"
            if [[ -e "$dest" ]]; then
              continue
            fi

            mkdir -p "$(dirname "$dest")"
            cp -a "/tmp/ref/$rel" "$dest"
            echo "  + $rel"
            COUNT=$((COUNT + 1))
          done < <(find . -type f -print | sort)

          echo
          echo "Total new files copied: $COUNT"
          echo "Total files skipped (excluded): $SKIPPED"

      # ──────────────────────────────────────────────────────────
      # 5) Upload the diff artifact. Runs regardless of whether
      #    the push later succeeds or fails.
      # ──────────────────────────────────────────────────────────
      - name: Upload diff patch (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlator-ref-diff-${{ github.run_number }}
          path: |
            diff-out/winlator-ref.patch
            diff-out/winlator-ref-summary.txt
            diff-out/README.md
          if-no-files-found: warn

      # ──────────────────────────────────────────────────────────
      # 6) Commit and force-push to the base branch.
      #    Only pushes if something changed.
      # ──────────────────────────────────────────────────────────
      - name: Commit and force-push to ${{ env.BASE_BRANCH }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # Never stage CI-only scaffolding.
          git add -A -- \
            ':(exclude).github' \
            ':(exclude)diff-out' \
            ':(exclude)*.md'

          if git diff --cached --quiet; then
            echo ">>> No changes to commit — base already matches reference."
            exit 0
          fi

          echo "---- staged summary ----"
          git diff --cached --stat | tail -40
          echo "------------------------"

          git commit -q -m "sync: import winlatormali source from $REF_REPO@$REF_BRANCH_USED"
          git --no-pager log -1 --oneline

          echo
          echo ">>> force-pushing to origin/$BASE_BRANCH"
          git push --force origin "HEAD:refs/heads/$BASE_BRANCH"
          echo ">>> push done"
