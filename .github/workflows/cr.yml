name: Build PanVK G57 for Android (pure NDK cross-compile)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update'
        required: true
        default: 'panvk-test'
      mesa_branch:
        description: 'Branch to build from'
        type: choice
        required: true
        default: 'winlator-pan'
        options:
          - winlator-pan
          - main
      api_override:
        description: 'Vulkan API override (leave empty to keep as-is)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      NDK_VERSION: 'r28c'
      ANDROID_API: '33'

    steps:
      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake pkgconf bison flex ripgrep \
            clang-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev \
            libclc-19 libclc-19-dev libllvmspirvlib-19-dev \
            libdrm-dev zlib1g-dev \
            patchelf curl ca-certificates zip wget
          python3 -m venv .ci-python
          .ci-python/bin/pip install \
            meson==1.8.3 Mako==1.3.10 packaging==25.0 PyYAML==6.0.2 ply==3.11
          echo "$GITHUB_WORKSPACE/.ci-python/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Download Android NDK ${NDK_VERSION}
        run: |
          set -euo pipefail
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q "${NDK_ZIP}" -d /opt
          echo "PANVK_NDK=/opt/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          test -x "/opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"

      - name: Checkout PanVK source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.mesa_branch }}
          path: mesa
          fetch-depth: 1

      - name: Report checked-out commit
        working-directory: mesa
        run: |
          git --no-pager log -1 --oneline
          ls -A | head -40

      - name: Revert vk_android_native_buffer.h to upstream guard
        working-directory: mesa
        run: |
          set -euo pipefail
          F="include/vulkan/vk_android_native_buffer.h"
          [ -f "$F" ] || { echo "❌ $F not found"; exit 1; }

          echo "==== before (lines 15-35) ===="
          awk 'NR>=15 && NR<=35 {printf "%4d| %s\n", NR, $0}' "$F"

          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          lines = src.splitlines(keepends=True)
          patched = 0
          out = []
          for line in lines:
              stripped = line.lstrip()
              if (patched == 0
                      and stripped.startswith("#if")
                      and "defined(__ANDROID__)" in line
                      and "defined(ANDROID)"    in line
                      and "&& 0"                in line):
                  indent = line[:len(line) - len(stripped)]
                  nl = "\n" if line.endswith("\n") else ""
                  out.append(f"{indent}#if defined(__ANDROID__) || defined(ANDROID){nl}")
                  patched += 1
              else:
                  out.append(line)
          if patched:
              with open(p, "w", encoding="utf-8", newline="") as f:
                  f.write("".join(out))
              print(f"✔ reverted {patched} line(s)")
          else:
              print("✔ already clean — nothing to revert")
          PY

          echo "==== after (lines 15-35) ===="
          awk 'NR>=15 && NR<=35 {printf "%4d| %s\n", NR, $0}' "$F"
          if grep -nE '#if[^#]*#if' "$F"; then
            echo "❌ file still contains concatenated #if directives"
            exit 1
          fi
          echo "✔ no concatenated #if found"

      - name: Force desktop vulkan.sym symbol scheme
        working-directory: mesa
        run: |
          set -euo pipefail
          F="src/vulkan/meson.build"
          [ -f "$F" ] || { echo "❌ $F not found"; exit 1; }

          if ! grep -q "vulkan-android.sym" "$F"; then
            echo "✔ already using desktop vulkan.sym — skipping"
            exit 0
          fi

          sed -i \
            -e 's/vulkan-icd-android-symbols\.txt/vulkan-icd-symbols.txt/g' \
            -e 's/vulkan-android\.sym/vulkan.sym/g' \
            "$F"

          ifs=$(grep -cE '^[[:space:]]*(if|elif)\b' "$F")
          endifs=$(grep -cE '^[[:space:]]*endif\b'   "$F")
          echo "if/elif count: $ifs   endif count: $endifs"
          if [ "$ifs" -ne "$endifs" ]; then
            echo "❌ if/endif mismatch in $F — refusing to continue"
            exit 1
          fi
          echo "✔ if/endif balanced"

      - name: Make android_stub hw_get_module() return failure
        working-directory: mesa
        run: |
          set -euo pipefail
          F="src/android_stub/hardware_stub.cpp"
          [ -f "$F" ] || { echo "⚠️  $F not present — skipping"; exit 0; }
          if grep -q "PATCH: honest stub" "$F"; then
            echo "✔ already patched"; exit 0
          fi
          cat > "$F" <<'EOF'
          /* PATCH: honest stub — no real Android HAL registry is reachable
           * from this build, so report failure rather than 0 (success)
           * without setting *module (callers dereference it on success). */
          extern "C" {

          struct hw_module_t;

          int hw_get_module(const char *id, const struct hw_module_t **module)
          {
             (void)id;
             *module = 0;
             return -1;
          }

          }
          EOF
          echo "✔ rewrote $F"

      - name: Probe all fds in vk_common_GetAndroidHardwareBufferPropertiesANDROID
        working-directory: mesa
        run: |
          set -euo pipefail
          F="src/vulkan/runtime/vk_android.c"
          [ -f "$F" ] || { echo "⚠️  $F not found — skipping"; exit 0; }
          if grep -q "PANVK_PATCHED_VK_ANDROID_FD_PROBE" "$F"; then
            echo "✔ already patched"; exit 0
          fi
          python3 - "$F" <<'PY'
          import re, sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          orig = src
          old = (
              "   const native_handle_t *handle = AHardwareBuffer_getNativeHandle(buffer);\n"
              "   assert(handle && handle->numFds > 0);\n"
              "   pProperties->allocationSize = lseek(handle->data[0], 0, SEEK_END);\n"
          )
          new = (
              "   const native_handle_t *handle = AHardwareBuffer_getNativeHandle(buffer);\n"
              "   assert(handle && handle->numFds > 0);\n"
              "   /* PANVK_PATCHED_VK_ANDROID_FD_PROBE: probe every fd; some gralloc\n"
              "    * implementations put metadata at data[0] and the real dma-buf\n"
              "    * at a later index. */\n"
              "   int dma_buf_fd = handle->data[0];\n"
              "   off_t dma_buf_size = lseek(dma_buf_fd, 0, SEEK_END);\n"
              "   if (dma_buf_size <= 0) {\n"
              "      for (int _i = 1; _i < handle->numFds; _i++) {\n"
              "         off_t _sz = lseek(handle->data[_i], 0, SEEK_END);\n"
              "         if (_sz > 0) { dma_buf_fd = handle->data[_i];\n"
              "                        dma_buf_size = _sz; break; }\n"
              "      }\n"
              "   }\n"
              "   pProperties->allocationSize = dma_buf_size;\n"
          )
          if old in src:
              src = src.replace(old, new, 1)
          else:
              pat = re.compile(
                  r'pProperties->allocationSize\s*=\s*lseek\(\s*handle->data\[0\]\s*,\s*0\s*,\s*SEEK_END\s*\);'
              )
              if not pat.search(src):
                  print("⚠️  could not find lseek(data[0]) — fork may already be patched")
                  sys.exit(0)
              src = pat.sub(
                  "/* PANVK_PATCHED_VK_ANDROID_FD_PROBE */\n"
                  "   int dma_buf_fd = handle->data[0];\n"
                  "   off_t dma_buf_size = lseek(dma_buf_fd, 0, SEEK_END);\n"
                  "   if (dma_buf_size <= 0) {\n"
                  "      for (int _i = 1; _i < handle->numFds; _i++) {\n"
                  "         off_t _sz = lseek(handle->data[_i], 0, SEEK_END);\n"
                  "         if (_sz > 0) { dma_buf_fd = handle->data[_i];\n"
                  "                        dma_buf_size = _sz; break; }\n"
                  "      }\n"
                  "   }\n"
                  "   pProperties->allocationSize = dma_buf_size;",
                  src, count=1,
              )
          src = src.replace(
              "VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT, handle->data[0],",
              "VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT, dma_buf_fd,",
              1,
          )
          if src == orig:
              print("⚠️  no changes applied"); sys.exit(0)
          open(p, "w", encoding="utf-8").write(src)
          print("✔ patched vk_common_GetAndroidHardwareBufferPropertiesANDROID")
          PY

      - name: Patch u_gralloc_panvk_test.h for unconditional fd probing
        working-directory: mesa
        run: |
          set -euo pipefail
          HDR="src/util/u_gralloc/u_gralloc_panvk_test.h"
          [ -f "$HDR" ] || { echo "⚠️  $HDR not found — skipping"; exit 0; }
          if grep -q "PANVK_PATCHED_FD_PROBE" "$HDR"; then
            echo "✔ already patched — skipping"; exit 0
          fi
          cat > "$HDR" <<'HDR_EOF'
          /* SPDX-License-Identifier: MIT */
          #ifndef U_GRALLOC_PANVK_TEST_H
          #define U_GRALLOC_PANVK_TEST_H

          #include <cutils/native_handle.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include "util/log.h"

          /* PANVK_PATCHED_FD_PROBE
           *
           * Probe every native_handle_t->data[i] with lseek(SEEK_END) and
           * return the fd with the largest positive size.
           *
           * Some Android gralloc implementations put a sync_file or metadata
           * fd at data[0] and the actual dma-buf at data[1] or later.
           * Falls back to data[0] if nothing probes valid.
           */
          static inline int
          u_gralloc_panvk_test_fd(const native_handle_t *handle, const char *where)
          {
             if (!handle || handle->numFds < 1)
                return -1;

             int   best_fd   = -1;
             off_t best_size = 0;

             for (int i = 0; i < handle->numFds; i++) {
                int   fd   = handle->data[i];
                off_t size = lseek(fd, 0, SEEK_END);
                if (size <= 0)
                   continue;
                if (size > best_size) {
                   best_size = size;
                   best_fd   = fd;
                }
             }

             if (best_fd < 0) {
                mesa_loge("AHBFD %s: no valid dma-buf in %d entries, "
                          "falling back to data[0]", where, handle->numFds);
                return handle->data[0];
             }

             mesa_logi("AHBFD %s: selected fd=%d size=%lld (of %d entries)",
                       where, best_fd, (long long)best_size, handle->numFds);
             return best_fd;
          }

          #endif
          HDR_EOF
          echo "✔ rewrote $HDR"

      - name: Make libudev optional in top-level meson.build
        working-directory: mesa
        run: |
          set -euo pipefail
          sed -i "s/dependency('libudev',/dependency('libudev', required : false, disabler : true, /g" meson.build
          sed -i "s/has_header('libudev.h')/false/g" meson.build
          echo "✔ libudev made optional"

      - name: Guard panvk_android_hal_bridge out of Android builds
        working-directory: mesa
        run: |
          set -euo pipefail
          FILE="src/panfrost/vulkan/meson.build"
          [ -f "$FILE" ] || { echo "⚠️  $FILE not found — skipping"; exit 0; }
          python3 - "$FILE" <<'PY'
          import re, sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          if "if not with_platform_android" in src and "panvk_android_hal_bridge" in src:
              print("already guarded — skipping"); sys.exit(0)
          old = "panvk_android_hal_bridge = files('panvk_android_hal_bridge.c')"
          if old not in src:
              print("⚠️  pattern not found, skipping"); sys.exit(0)
          new = (
              "panvk_android_hal_bridge = []\n"
              "if not with_platform_android\n"
              "  panvk_android_hal_bridge = files('panvk_android_hal_bridge.c')\n"
              "endif"
          )
          src = src.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(src)
          print("✔ patched")
          PY

      - name: Override Vulkan API version (optional)
        if: github.event.inputs.api_override != ''
        working-directory: mesa
        run: |
          VER="${{ github.event.inputs.api_override }}"
          DEVFILE="src/panfrost/vulkan/panvk_physical_device.c"
          [ -f "$DEVFILE" ] || { echo "❌ $DEVFILE not found"; exit 1; }
          sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${VER//\./_}/" "$DEVFILE" || true

      - name: Build SPIRV-Tools (host) for mesa_clc / vtn_bindgen2
        run: |
          set -euo pipefail
          SDK_TAG=vulkan-sdk-1.4.309.0
          WORK="$GITHUB_WORKSPACE/spirv-host"
          HOST_DEPS="$WORK/prefix"
          mkdir -p "$WORK"

          git clone --depth 1 --branch "$SDK_TAG" \
            https://github.com/KhronosGroup/SPIRV-Tools.git "$WORK/SPIRV-Tools"
          git clone --depth 1 --branch "$SDK_TAG" \
            https://github.com/KhronosGroup/SPIRV-Headers.git \
            "$WORK/SPIRV-Tools/external/spirv-headers"

          cmake -S "$WORK/SPIRV-Tools" -B "$WORK/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOST_DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build "$WORK/build" --parallel 2
          cmake --install "$WORK/build"

          echo "HOST_DEPS=$HOST_DEPS" >> "$GITHUB_ENV"
          ls -la "$HOST_DEPS/lib/pkgconfig/"

      - name: Configure host tools
        working-directory: mesa
        env:
          CC: clang-19
          CXX: clang++-19
          LLVM_CONFIG: /usr/lib/llvm-19/bin/llvm-config
          PKG_CONFIG_PATH: ${{ env.HOST_DEPS }}/lib/pkgconfig:/usr/lib/llvm-19/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.HOST_DEPS }}/lib
        run: |
          meson setup build-host \
            --buildtype=release \
            -Dbuild-tests=false \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true

      - name: Build host tools
        working-directory: mesa
        env:
          CC: clang-19
          CXX: clang++-19
          LLVM_CONFIG: /usr/lib/llvm-19/bin/llvm-config
          PKG_CONFIG_PATH: ${{ env.HOST_DEPS }}/lib/pkgconfig:/usr/lib/llvm-19/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.HOST_DEPS }}/lib
        run: |
          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile
          find build-host -type f -executable \
            \( -name 'mesa_clc' -o -name 'vtn_bindgen2' -o -name 'panfrost_compile' \) -print

      - name: Stage host tools on PATH
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/host-bin"
          for name in mesa_clc vtn_bindgen2 panfrost_compile; do
            bin=$(find "$GITHUB_WORKSPACE/mesa/build-host" -type f -executable -name "$name" | head -n1)
            [ -n "$bin" ] || { echo "❌ $name not found"; exit 1; }
            dashed=$(echo "$name" | tr '_' '-')
            cp "$bin" "$GITHUB_WORKSPACE/host-bin/$name"
            cp "$bin" "$GITHUB_WORKSPACE/host-bin/$dashed"
            echo "✔ staged $name -> $dashed"
          done
          echo "$GITHUB_WORKSPACE/host-bin" >> "$GITHUB_PATH"

      - name: Create Meson cross file
        run: |
          set -euo pipefail
          NDK_BIN="$PANVK_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          EMPTY_PKGCONFIG="$(mktemp -d)"
          echo "PANVK_EMPTY_PKGCONFIG=$EMPTY_PKGCONFIG" >> "$GITHUB_ENV"
          cat > "$GITHUB_WORKSPACE/android-aarch64.ini" <<EOF
          [binaries]
          c = '${NDK_BIN}/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '${NDK_BIN}/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '${NDK_BIN}/llvm-ar'
          strip = '${NDK_BIN}/llvm-strip'
          pkg-config = '/usr/bin/pkgconf'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = ['${EMPTY_PKGCONFIG}']

          [built-in options]
          c_args = ['-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          cpp_args = ['-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          cpp_link_args = ['-static-libstdc++']
          pkg_config_path = []
          EOF
          cat "$GITHUB_WORKSPACE/android-aarch64.ini"

      - name: Configure PanVK (Android, static libdrm, no host libs)
        working-directory: mesa
        run: |
          PKG_CONFIG_PATH= meson setup build-android \
            --cross-file "$GITHUB_WORKSPACE/android-aarch64.ini" \
            --buildtype=release \
            -Dbuild-tests=false \
            -Dplatforms=android \
            -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dandroid-libperfetto=disabled \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dpanfrost-kmds=kbase,panthor \
            -Dpanvk-use-kbase=true \
            -Dpanfrost-rust=false \
            -Dllvm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dshader-cache=disabled \
            -Dxmlconfig=disabled \
            -Dexpat=disabled \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dzlib=disabled \
            -Dzstd=disabled \
            -Dvideo-codecs= \
            -Dperfetto=false \
            -Dstrip=true \
            -Dcpp_rtti=false \
            --force-fallback-for=libdrm \
            -Dallow-fallback-for=libdrm \
            -Dlibdrm:default_library=static

      # =====================================================================
      # BUILD + LOCATE (heavily instrumented)
      # =====================================================================
      - name: Build PanVK Vulkan driver (.so)
        working-directory: mesa
        env:
          PATH: ${{ github.workspace }}/host-bin:/usr/lib/llvm-19/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          LD_LIBRARY_PATH: ${{ env.HOST_DEPS }}/lib
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "== Meson's authoritative target list (intro-targets)  =="
          echo "=========================================================="
          if [ -f build-android/meson-info/intro-targets.json ]; then
            python3 - <<'PY'
          import json
          with open('build-android/meson-info/intro-targets.json') as f:
              targets = json.load(f)
          print(f"total meson targets: {len(targets)}")
          for t in targets:
              n = t.get('name', '') or ''
              if 'vulkan' in n.lower() or 'panfrost' in n.lower() or 'panvk' in n.lower():
                  print(f"  {n:55s} type={t.get('type','?'):22s} file={t.get('filename','')}")
          PY
          else
            echo "(no build-android/meson-info/intro-targets.json)"
          fi

          echo
          echo "=========================================================="
          echo "== ninja targets matching vulkan/panfrost/panvk      =="
          echo "=========================================================="
          ninja -C build-android -t targets all 2>&1 \
            | grep -iE 'vulkan|panfrost|panvk' | sort -u || true

          echo
          echo "=========================================================="
          echo "== building the whole tree                            =="
          echo "=========================================================="
          ninja -C build-android

          echo
          echo "=========================================================="
          echo "== contents of build-android/src/panfrost/vulkan/     =="
          echo "=========================================================="
          if [ -d build-android/src/panfrost/vulkan ]; then
            find build-android/src/panfrost/vulkan -maxdepth 1 \
              \( -type f -o -type l \) \
              -printf '%y  %p  ->  %l\n' | sort
          else
            echo "(directory not present)"
          fi

          echo
          echo "=========================================================="
          echo "== every .so / .so.* anywhere in build-android        =="
          echo "=========================================================="
          find build-android \( -name '*.so' -o -name '*.so.*' \) \
            \( -type f -o -type l \) -printf '%y  %p  ->  %l\n' | sort || true

          echo
          echo "=========================================================="
          echo "== locating the driver .so                            =="
          echo "=========================================================="
          SO=$(find build-android \
                 \( -name 'libvulkan_panfrost.so' -o -name 'libvulkan_panfrost.so.*' \
                    -o -name 'libvulkan_panvk.so'   -o -name 'libvulkan_panvk.so.*' \
                    -o -name 'libpanvk.so'          -o -name 'libpanvk.so.*' \) \
                 \( -type f -o -type l \) -print 2>/dev/null | head -n1)
          if [ -z "$SO" ]; then
            echo "❌ no driver .so found anywhere under build-android"
            echo "---- everything under build-android/src/panfrost ----"
            find build-android/src/panfrost -maxdepth 3 \( -type f -o -type l \) \
              -printf '%y  %p\n' 2>/dev/null | sort | head -80 || true
            exit 1
          fi
          echo "✔ found: $SO"
          ls -la "$SO"
          REAL=$(readlink -f "$SO")
          echo "resolved to: $REAL"
          echo "PANVK_SO=$REAL" >> "$GITHUB_ENV"

      # =====================================================================
      # VERIFY
      # =====================================================================
      - name: Verify driver links ONLY system libraries
        run: |
          set -euo pipefail
          SO="$PANVK_SO"
          [ -f "$SO" ] || { echo "❌ $SO not found"; exit 1; }

          echo "==== DT_NEEDED ===="
          readelf -d "$SO" | grep NEEDED || true

          echo
          echo "==== checking for forbidden Termux / host libs ===="
          bad=0
          for bad_name in liblzma libzstd libunwind libc++_shared libdrm.so.2; do
            if strings "$SO" | grep -q "$bad_name"; then
              echo "❌ $SO references $bad_name"
              bad=1
            fi
          done
          if [ "$bad" = "0" ]; then
            echo "✔ no Termux/host library references found"
          fi

          echo
          echo "==== confirming no host libdrm in output ===="
          if readelf -d "$SO" | grep NEEDED | grep -qi drm; then
            echo "❌ host libdrm leaked in"
          else
            echo "✔ no libdrm NEEDED entry (static fallback used)"
          fi

          echo
          echo "==== vk_icdGetInstanceProcAddr exported? ===="
          nm -D "$SO" 2>/dev/null | grep -i 'vk_icdGetInstanceProcAddr' || \
            echo "❌ vk_icdGetInstanceProcAddr NOT exported"

          echo
          echo "==== AHBFD strings (fd probe compiled in)? ===="
          strings "$SO" | grep -i 'AHBFD' || \
            echo "⚠️  no AHBFD strings found"

      # =====================================================================
      # PACKAGE
      # =====================================================================
      - name: Package AdrenoTools driver ZIP
        run: |
          set -euo pipefail

          SO="$PANVK_SO"
          [ -f "$SO" ] || { echo "❌ $SO not found"; exit 1; }

          if [ ! -f mesa/meta.json ]; then
            echo "❌ meta.json not found at repo root (mesa/meta.json)"
            ls -A mesa | head -40
            exit 1
          fi

          OUT_NAME="panvcake_26.3.0.R2.zip"
          STAGE="adreno-driver"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          ${PANVK_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            --strip-unneeded -o "$STAGE/libvulkan_panfrost.so" "$SO"

          cp mesa/meta.json "$STAGE/meta.json"

          ls -la "$STAGE"
          readelf -d "$STAGE/libvulkan_panfrost.so" | grep NEEDED || true

          cd "$STAGE"
          zip -9 "../${OUT_NAME}" meta.json libvulkan_panfrost.so
          cd ..

          unzip -l "${OUT_NAME}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-build-logs
          path: |
            mesa/build-android/meson-logs/
            mesa/build-host/meson-logs/
          if-no-files-found: ignore

      - name: Upload driver ZIP as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: panVK-G57-driver-adrenotools-zip
          path: panvcake_*.zip
          if-no-files-found: error

      - name: Upload release assets
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
            # PanVK `panvcake` driver for AdrenoTools (pure NDK build)

            Custom Mesa PanVK Vulkan driver for Mali-G57 (Valhall JM),
            cross-compiled with the Android NDK r28c. **No Termux, no host
            libraries** — the resulting `.so` only references
            `/system/lib64/*`.

            ## Why this build is different

            - `pkg-config` is isolated (empty libdir)
            - `libdrm` is built statically from Mesa's fallback subproject
            - `zlib` / `zstd` / `shader-cache` / `libunwind` are disabled
            - `-static-libstdc++` removes the `libc++_shared` dependency

            ## What's included

            - Desktop `vulkan.sym` so `vk_icdGetInstanceProcAddr` is
              exported (AdrenoTools needs it)
            - Honest `hw_get_module()` stub
            - fd probing for gralloc handles

            ## Install (AdrenoTools)

            1. Download `panvcake_*.zip`.
            2. In AdrenoTools, choose **Import driver** and select the ZIP
               directly. Do **not** unzip it.
            3. Apply to the container and launch.

            ## Notes

            - Built for Mali-G57 (Valhall JM) with the kbase kernel driver.
            - API level: ${{ env.ANDROID_API }}
            - Source branch: `${{ github.event.inputs.mesa_branch }}`
            - Workflow run: `${{ github.run_number }}`
          files: |
            panvcake_*.zip
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
