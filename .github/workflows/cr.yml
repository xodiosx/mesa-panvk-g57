name: PanVK G57 - WinlatorMali Android candidate

on:
  workflow_dispatch:
  push:
    branches: [winlator-pan]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: 28.2.13676358
      ANDROID_API: '35'
      BUILD_JOBS: '2'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: mesa
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkgconf bison flex ripgrep \
            clang-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev \
            libclc-19 libclc-19-dev libllvmspirvlib-19-dev libdrm-dev \
            zlib1g-dev python3-venv patchelf
          python3 -m venv .ci-python
          .ci-python/bin/pip install meson==1.8.3 Mako==1.3.10 \
            packaging==25.0 PyYAML==6.0.2 ply==3.11
          echo "$GITHUB_WORKSPACE/.ci-python/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          echo "PANVK_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # =====================================================================
      # PATCHES — applied to mesa/ before building
      # =====================================================================

      - name: Revert vk_android_native_buffer.h to upstream guard
        working-directory: mesa
        run: |
          set -euo pipefail
          F="include/vulkan/vk_android_native_buffer.h"
          [ -f "$F" ] || { echo "❌ $F not found"; exit 1; }
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          lines = src.splitlines(keepends=True)
          patched = 0
          out = []
          for line in lines:
              s = line.lstrip()
              if (patched == 0 and s.startswith("#if")
                      and "defined(__ANDROID__)" in line
                      and "defined(ANDROID)"    in line
                      and "&& 0"                in line):
                  indent = line[:len(line) - len(s)]
                  nl = "\n" if line.endswith("\n") else ""
                  out.append(f"{indent}#if defined(__ANDROID__) || defined(ANDROID){nl}")
                  patched += 1
              else:
                  out.append(line)
          if patched:
              open(p, "w", encoding="utf-8", newline="").write("".join(out))
              print(f"✔ reverted {patched} line(s)")
          else:
              print("✔ already clean")
          PY

      - name: Force desktop vulkan.sym symbol scheme
        working-directory: mesa
        run: |
          set -euo pipefail
          F="src/vulkan/meson.build"
          [ -f "$F" ] || { echo "❌ $F not found"; exit 1; }
          if ! grep -q "vulkan-android.sym" "$F"; then
            echo "✔ already desktop vulkan.sym"; exit 0
          fi
          sed -i \
            -e 's/vulkan-icd-android-symbols\.txt/vulkan-icd-symbols.txt/g' \
            -e 's/vulkan-android\.sym/vulkan.sym/g' "$F"
          echo "✔ replaced Android HAL symbol scheme with desktop vulkan.sym"

      - name: Make android_stub hw_get_module() return failure
        working-directory: mesa
        run: |
          set -euo pipefail
          F="src/android_stub/hardware_stub.cpp"
          [ -f "$F" ] || { echo "⚠️  not present"; exit 0; }
          if grep -q "PATCH: honest stub" "$F"; then exit 0; fi
          cat > "$F" <<'EOF'
          /* PATCH: honest stub */
          extern "C" {
          struct hw_module_t;
          int hw_get_module(const char *id, const struct hw_module_t **module)
          {
             (void)id;
             *module = 0;
             return -1;
          }
          }
          EOF
          echo "✔ rewrote $F"

      - name: Probe all fds in vk_common_GetAndroidHardwareBufferPropertiesANDROID
        working-directory: mesa
        run: |
          set -euo pipefail
          F="src/vulkan/runtime/vk_android.c"
          [ -f "$F" ] || { echo "⚠️  not found"; exit 0; }
          if grep -q "PANVK_PATCHED_VK_ANDROID_FD_PROBE" "$F"; then exit 0; fi
          python3 - "$F" <<'PY'
          import re, sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          pat = re.compile(
              r'pProperties->allocationSize\s*=\s*lseek\(\s*handle->data\[0\]\s*,\s*0\s*,\s*SEEK_END\s*\);'
          )
          if not pat.search(src):
              print("⚠️  lseek(data[0]) not found"); sys.exit(0)
          src = pat.sub(
              "/* PANVK_PATCHED_VK_ANDROID_FD_PROBE */\n"
              "   int dma_buf_fd = handle->data[0];\n"
              "   off_t dma_buf_size = lseek(dma_buf_fd, 0, SEEK_END);\n"
              "   if (dma_buf_size <= 0) {\n"
              "      for (int _i = 1; _i < handle->numFds; _i++) {\n"
              "         off_t _sz = lseek(handle->data[_i], 0, SEEK_END);\n"
              "         if (_sz > 0) { dma_buf_fd = handle->data[_i];\n"
              "                        dma_buf_size = _sz; break; }\n"
              "      }\n"
              "   }\n"
              "   pProperties->allocationSize = dma_buf_size;",
              src, count=1,
          )
          src = src.replace(
              "VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT, handle->data[0],",
              "VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT, dma_buf_fd,",
              1,
          )
          open(p, "w", encoding="utf-8").write(src)
          print("✔ patched vk_android.c fd probe")
          PY

      - name: Patch u_gralloc_panvk_test.h for unconditional fd probing
        working-directory: mesa
        run: |
          set -euo pipefail
          HDR="src/util/u_gralloc/u_gralloc_panvk_test.h"
          [ -f "$HDR" ] || { echo "⚠️  not found"; exit 0; }
          if grep -q "PANVK_PATCHED_FD_PROBE" "$HDR"; then exit 0; fi
          cat > "$HDR" <<'HDR_EOF'
          /* SPDX-License-Identifier: MIT */
          #ifndef U_GRALLOC_PANVK_TEST_H
          #define U_GRALLOC_PANVK_TEST_H
          #include <cutils/native_handle.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include "util/log.h"
          static inline int
          u_gralloc_panvk_test_fd(const native_handle_t *handle, const char *where)
          {
             if (!handle || handle->numFds < 1) return -1;
             int   best_fd   = -1;
             off_t best_size = 0;
             for (int i = 0; i < handle->numFds; i++) {
                int   fd   = handle->data[i];
                off_t size = lseek(fd, 0, SEEK_END);
                if (size <= 0) continue;
                if (size > best_size) { best_size = size; best_fd = fd; }
             }
             if (best_fd < 0) {
                mesa_loge("AHBFD %s: no valid dma-buf in %d entries",
                          where, handle->numFds);
                return handle->data[0];
             }
             mesa_logi("AHBFD %s: selected fd=%d size=%lld",
                       where, best_fd, (long long)best_size);
             return best_fd;
          }
          #endif
          HDR_EOF
          echo "✔ rewrote $HDR"

      # Guard panvk_android_hal_bridge out of Android builds. Under
      # -Dplatforms=android, both panvk_android_hal_bridge.c and
      # vk_android.c (in libvulkan_lite_runtime.a) define `HMI`, which makes
      # the final link fail with "duplicate symbol: HMI".
      - name: Guard panvk_android_hal_bridge out of Android builds
        working-directory: mesa
        run: |
          set -euo pipefail
          FILE="src/panfrost/vulkan/meson.build"
          [ -f "$FILE" ] || { echo "⚠️  $FILE not found"; exit 0; }
          python3 - "$FILE" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          if "if not with_platform_android" in src and "panvk_android_hal_bridge" in src:
              print("✔ already guarded"); sys.exit(0)
          old = "panvk_android_hal_bridge = files('panvk_android_hal_bridge.c')"
          if old not in src:
              print("⚠️  pattern not found, skipping"); sys.exit(0)
          src = src.replace(
              old,
              "panvk_android_hal_bridge = []\n"
              "if not with_platform_android\n"
              "  panvk_android_hal_bridge = files('panvk_android_hal_bridge.c')\n"
              "endif",
              1,
          )
          open(p, "w", encoding="utf-8").write(src)
          print("✔ guarded panvk_android_hal_bridge")
          PY
          echo "==== after ===="
          grep -n -A4 'panvk_android_hal_bridge' "$FILE" | head -20

      # =====================================================================
      # BUILD — literally the reference build.sh, inline
      # =====================================================================

      - name: Build host tools and Android driver
        working-directory: mesa
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD"
          WORK="$GITHUB_WORKSPACE/ci-winlatormali"
          mkdir -p "$WORK"
          exec > >(tee "$WORK/build.log") 2>&1

          : "${PANVK_NDK:?Set PANVK_NDK to the NDK directory}"
          export ANDROID_API="${ANDROID_API:-35}"
          BUILD_JOBS="${BUILD_JOBS:-2}"
          NDKBIN="$PANVK_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDKBIN/aarch64-linux-android${ANDROID_API}-clang"

          # --- SPIRV-Tools for host ---
          SDK_TAG=vulkan-sdk-1.4.309.0
          HOST_DEPS="$WORK/host-deps"
          git clone --depth 1 --branch "$SDK_TAG" \
            https://github.com/KhronosGroup/SPIRV-Tools.git "$WORK/SPIRV-Tools"
          git clone --depth 1 --branch "$SDK_TAG" \
            https://github.com/KhronosGroup/SPIRV-Headers.git \
            "$WORK/SPIRV-Tools/external/spirv-headers"
          cmake -S "$WORK/SPIRV-Tools" -B "$WORK/spirv-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOST_DEPS" \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build "$WORK/spirv-build" --parallel "$BUILD_JOBS"
          cmake --install "$WORK/spirv-build"

          export PATH="/usr/lib/llvm-19/bin:$PATH"
          export PKG_CONFIG_PATH="$HOST_DEPS/lib/pkgconfig:/usr/lib/llvm-19/lib/pkgconfig"
          export LD_LIBRARY_PATH="$HOST_DEPS/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export LLVM_CONFIG=/usr/bin/llvm-config-19

          COMMON=(--buildtype=release -Dbuild-tests=false -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost -Dpanfrost-kmds=kbase,panthor \
            -Dpanvk-use-kbase=true -Dpanfrost-rust=false \
            -Degl=disabled -Dglx=disabled -Dgles1=disabled -Dgles2=disabled \
            -Dopengl=false -Dgbm=disabled -Dperfetto=false -Dvideo-codecs= \
            -Dshader-cache=disabled -Dxmlconfig=disabled -Dexpat=disabled \
            -Dlibunwind=disabled -Dzstd=disabled)

          # --- native host tools ---
          CC=clang-19 CXX=clang++-19 meson setup build-winlatormali-native \
            "${COMMON[@]}" -Dplatforms= -Dllvm=enabled \
            -Dmesa-clc=enabled -Dprecomp-compiler=enabled
          meson compile -C build-winlatormali-native -j "$BUILD_JOBS" \
            mesa_clc vtn_bindgen2 panfrost_compile

          mkdir -p "$WORK/host-bin"
          for name in mesa_clc vtn_bindgen2 panfrost_compile; do
            bin=$(find "$ROOT/build-winlatormali-native" -type f -executable -name "$name" | head -n1)
            [ -n "$bin" ] || { echo "❌ $name not found"; exit 1; }
            cp "$bin" "$WORK/host-bin/$name"
            cp "$bin" "$WORK/host-bin/$(echo "$name" | tr '_' '-')"
          done
          chmod -R +x "$WORK/host-bin"
          export PATH="$WORK/host-bin:$PATH"

          # --- cross file ---
          mkdir -p "$WORK/empty-pkgconfig"
          cat > "$WORK/android-aarch64.ini" <<EOF
          [binaries]
          c = '${NDKBIN}/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '${NDKBIN}/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '${NDKBIN}/llvm-ar'
          strip = '${NDKBIN}/llvm-strip'
          pkg-config = '/usr/bin/pkgconf'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = ['${WORK}/empty-pkgconfig']

          [built-in options]
          c_args = ['-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          cpp_args = ['-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          cpp_link_args = ['-static-libstdc++']
          pkg_config_path = []
          EOF

          # --- Android cross build ---
          PKG_CONFIG_PATH= meson setup build-winlatormali-android \
            --cross-file "$WORK/android-aarch64.ini" "${COMMON[@]}" \
            -Dplatforms=android -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true -Dandroid-libbacktrace=disabled \
            -Dandroid-libperfetto=disabled -Dzlib=disabled \
            -Dllvm=disabled -Dspirv-tools=disabled -Dcpp_rtti=false \
            -Dmesa-clc=system -Dprecomp-compiler=system \
            --force-fallback-for=libdrm -Dallow-fallback-for=libdrm \
            -Dlibdrm:default_library=static

          meson compile -C build-winlatormali-android -j "$BUILD_JOBS" vulkan_panfrost

          echo "=== build complete ==="
          find build-winlatormali-android -name 'libvulkan_panfrost.so*' -print

      - name: Collect build output
        working-directory: mesa
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out-winlatormali"
          SO=$(find build-winlatormali-android -name 'libvulkan_panfrost.so' -print -quit)
          if [ -z "$SO" ]; then
            echo "❌ libvulkan_panfrost.so not found"
            find build-winlatormali-android -name '*.so*' -print | sort
            exit 1
          fi
          cp -a "$SO" "$GITHUB_WORKSPACE/out-winlatormali/"
          cp -a "$SO" "$GITHUB_WORKSPACE/out-winlatormali/libvulkan_panfrost.so"
          echo "=== DT_NEEDED ==="
          readelf -d "$GITHUB_WORKSPACE/out-winlatormali/libvulkan_panfrost.so" | grep NEEDED || true
          echo "=== vk_icdGetInstanceProcAddr ==="
          nm -D "$GITHUB_WORKSPACE/out-winlatormali/libvulkan_panfrost.so" 2>/dev/null | grep -i 'vk_icdGetInstanceProcAddr' || echo "(missing)"
          echo "=== AHBFD strings ==="
          strings "$GITHUB_WORKSPACE/out-winlatormali/libvulkan_panfrost.so" | grep -i AHBFD || echo "(none)"
          ls -la "$GITHUB_WORKSPACE/out-winlatormali/"

      - name: Package driver ZIP
        run: |
          set -euo pipefail
          STAGE=adreno-driver
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp out-winlatormali/libvulkan_panfrost.so "$STAGE/"
          if [ -f mesa/meta.json ]; then
            cp mesa/meta.json "$STAGE/"
          else
            echo "{}" > "$STAGE/meta.json"
          fi
          ( cd "$STAGE" && zip -9 ../panvcake.zip meta.json libvulkan_panfrost.so )
          unzip -l panvcake.zip

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G57-WinlatorMali-candidate
          path: out-winlatormali/
          if-no-files-found: error

      - name: Upload driver ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G57-driver-zip
          path: panvcake.zip
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G57-WinlatorMali-build-logs
          path: |
            mesa/build-winlatormali-native/meson-logs/
            mesa/build-winlatormali-android/meson-logs/
            ci-winlatormali/build.log
          if-no-files-found: ignore
