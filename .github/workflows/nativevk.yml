name: release PanVK + Zink for Termux (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write PANVKDBG patch script
        run: |
          mkdir -p "${{ github.workspace }}/ci-scripts"
          cat > "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py" << 'PYEOF'
          #!/usr/bin/env python3
          """
          Strip PANVKDBG debug output entirely from the Mesa fork's source
          tree, before compilation. The calls are removed from the source
          (not merely wrapped in `if (0)`), so there is no reliance on the
          compiler dead-code-eliminating argument evaluation. This also
          removes the format strings from the binary.

          Also adds an early return to the two BO/SHM dump helpers in
          kbase_kmod.c (SIGBUS source). Idempotent.
          """
          import re
          import sys
          from pathlib import Path

          ROOT = Path("src/panfrost")
          DUMP_HELPERS_FILE = Path("src/panfrost/lib/kmod/kbase_kmod.c")
          DUMP_HELPERS = (
              "kbase_kmod_debug_dump_native_bos",
              "kbase_kmod_debug_dump_user_buffers",
          )

          REWRAP_RE = re.compile(
              r'if\s*\(\s*0\s*\)\s*(?=fprintf\s*\(\s*stderr\s*,\s*"PANVKDBG)'
          )

          START_RE = re.compile(
              r'fprintf\s*\(\s*stderr\s*,\s*(?="PANVKDBG)'
          )

          def _find_statement_end(src, open_paren_idx):
              depth = 0
              i = open_paren_idx
              in_str = False
              in_chr = False
              while i < len(src):
                  c = src[i]
                  if in_str:
                      if c == "\\":
                          i += 2
                          continue
                      if c == '"':
                          in_str = False
                  elif in_chr:
                      if c == "\\":
                          i += 2
                          continue
                      if c == "'":
                          in_chr = False
                  else:
                      if c == '"':
                          in_str = True
                      elif c == "'":
                          in_chr = True
                      elif c == "(":
                          depth += 1
                      elif c == ")":
                          depth -= 1
                          if depth == 0:
                              i += 1
                              break
                  i += 1

              while i < len(src) and src[i] in " \t":
                  i += 1
              if i < len(src) and src[i] == ";":
                  i += 1
              if i < len(src) and src[i] == "\n":
                  i += 1
              return i

          def silence_fprintf(src):
              src = REWRAP_RE.sub("", src)
              out = []
              i = 0
              count = 0
              while i < len(src):
                  idx = src.find("fprintf", i)
                  if idx == -1:
                      out.append(src[i:])
                      break

                  m = START_RE.match(src, idx)
                  if not m:
                      out.append(src[i:idx + len("fprintf")])
                      i = idx + len("fprintf")
                      continue

                  open_paren = src.find("(", m.start())
                  end = _find_statement_end(src, open_paren)

                  out.append(src[i:idx])
                  i = end
                  count += 1

              return "".join(out), count

          def early_return(src, func_name):
              pat = re.compile(
                  re.escape(func_name) + r"\s*\([^;{]*?\)\s*\{", re.DOTALL
              )
              m = pat.search(src)
              if not m:
                  return src, False
              brace = src.rfind("{", m.start(), m.end())
              if brace < 0:
                  return src, False
              window = src[brace + 1 : brace + 250]
              if "DEBUG DISABLED" in window:
                  return src, False
              insertion = (
                  "\n   /* DEBUG DISABLED: dump path stripped for performance */\n"
                  "   return;"
              )
              return src[: brace + 1] + insertion + src[brace + 1 :], True

          def main():
              if not ROOT.exists():
                  print(f"ERROR: {ROOT} not found", file=sys.stderr)
                  return 1

              total_calls = 0
              total_files = 0

              for path in sorted(ROOT.rglob("*")):
                  if path.suffix not in (".c", ".h", ".cpp", ".cc", ".cxx", ".hpp"):
                      continue
                  try:
                      src = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if '"PANVKDBG' not in src:
                      continue
                  orig = src
                  src, n = silence_fprintf(src)
                  if n:
                      print(f"{path}: removed {n} PANVKDBG statement(s)")
                      total_calls += n
                      total_files += 1
                  if src != orig:
                      path.write_text(src)

              if DUMP_HELPERS_FILE.exists():
                  src = DUMP_HELPERS_FILE.read_text()
                  changed = False
                  for fn in DUMP_HELPERS:
                      src, ok = early_return(src, fn)
                      state = "patched" if ok else "skipped (already patched or not found)"
                      print(f"  {state}: {fn}")
                      if ok:
                          changed = True
                  if changed:
                      DUMP_HELPERS_FILE.write_text(src)

              print()
              print(f"Total files modified: {total_files}")
              print(f"Total PANVKDBG statements removed: {total_calls}")

              remaining = 0
              for path in ROOT.rglob("*"):
                  if path.suffix not in (".c", ".h", ".cpp", ".cc", ".cxx", ".hpp"):
                      continue
                  try:
                      remaining += path.read_text().count('"PANVKDBG')
                  except UnicodeDecodeError:
                      pass
              print(f"Total \"PANVKDBG literals remaining in tree: {remaining}")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          chmod +x "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py"
          echo "--- wrote ci-scripts/patch_panvkdbg.py ---"
          wc -l "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py"

      - name: Build PanVK + Zink (${{ matrix.build-type }}) inside Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"
          chmod 777 "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"

          docker run --rm \
            -v "${{ github.workspace }}/termux-out-${{ matrix.build-type }}:/termux-out" \
            -v "${{ github.workspace }}/ci-scripts:/ci-scripts:ro" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
              export BUILD_TYPE="'"${{ matrix.build-type }}"'"

              mkdir -p "$PREFIX/etc/apt/sources.list.d"
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > "$PREFIX/etc/apt/sources.list.d/termux-main.list"

              for i in 1 2 3; do
                if pkg update -y; then
                  break
                fi
                echo "pkg update attempt $i failed, retrying in 10s..."
                sleep 10
                if [[ $i -eq 3 ]]; then
                  echo "pkg update failed after 3 attempts" >&2
                  exit 1
                fi
              done

              pkg install -y x11-repo tur-repo
              pkg update -y || true

              pkg install -y \
                git clang lld ninja python python-pip pkg-config \
                bison flex cmake glslang shaderc vulkan-headers \
                vulkan-loader-generic libandroid-shmem libdrm libxcb \
                xorgproto libx11 libxshmfence zlib zstd libexpat \
                libclc spirv-llvm-translator libxrandr libxrandr-static file \
                libxext libxfixes libxdamage libxcb-keysyms libxcb-render \
                libxcb-render-util libxcb-shape libxcb-shm libxcb-sync \
                libxcb-xfixes libxcb-image libxcb-icccm libxcb-util

              pip install --break-system-packages meson mako pyyaml packaging

              mkdir -p "$TMPDIR"
              cd "$TMPDIR"
              rm -rf mesa-panvk
              git clone --depth 1 https://github.com/xodiosx/mesa-panvk-mali-g57.git mesa-panvk
              cd mesa-panvk

              echo "=============================================="
              echo "Removing PANVKDBG statements from source tree ..."
              echo "=============================================="
              if [[ ! -f /ci-scripts/patch_panvkdbg.py ]]; then
                echo "ERROR: /ci-scripts/patch_panvkdbg.py not mounted" >&2
                exit 1
              fi
              python3 /ci-scripts/patch_panvkdbg.py

              echo "=============================================="
              echo "Informational: residual PANVKDBG literals in tree ..."
              echo "=============================================="
              RESIDUAL=$(grep -r "\"PANVKDBG" src/panfrost/ | wc -l || true)
              echo "Residual \"PANVKDBG literals in source tree: $RESIDUAL"

              # ──────────────────────────────────────────────────────────
              # Meson setup — base options from the local build script,
              # extended to enable Zink (Gallium-on-Vulkan).
              #
              # Zink requires:
              #   -Dgallium-drivers=zink      (Zink is a Gallium driver)
              #   -Dopengl=true               (build the GL frontend)
              #   -Dgles2=enabled             (GLES 2/3 frontend)
              #   -Degl=enabled               (EGL surface + context API)
              # ──────────────────────────────────────────────────────────
              meson setup build-bionic \
                -Dbuildtype="$BUILD_TYPE" \
                -Dpanvk-use-kbase=true \
                -Dvulkan-drivers=panfrost \
                -Dgallium-drivers=zink \
                -Dplatforms=x11 \
                -Ddebug=false \
                -Dstrip=true \
                -Dbuild-tests=false \
                -Dc_link_args=-landroid-shmem \
                -Dcpp_link_args=-landroid-shmem \
                -Dpanfrost-kmds=kbase,panthor \
                -Dopengl=true \
                -Dgles2=enabled \
                -Degl=enabled \
                -Dglx=disabled \
                -Dgbm=disabled \
                -Dshared-glapi=enabled \
                -Dlibunwind=disabled \
                -Dvalgrind=disabled \
                -Dperfetto=false \
                -Dprefix="$PREFIX"

              echo "=============================================="
              echo "Building entire tree (panvk + zink + GL/EGL) ..."
              echo "=============================================="
              # Build everything. This produces, among other things:
              #   src/panfrost/vulkan/libvulkan_panfrost.so    (PanVK)
              #   src/gallium/targets/dri/libgallium_dri.so    (contains zink)
              #   src/egl/libEGL.so.*                          (EGL loader)
              #   src/mapi/shared-glapi/libglapi.so.*          (GL API dispatch)
              ninja -C build-bionic -j$(nproc)

              echo "=============================================="
              echo "Informational: PANVKDBG strings in built panvk .so ..."
              echo "=============================================="
              SO_STRINGS=$(strings build-bionic/src/panfrost/vulkan/libvulkan_panfrost.so \
                             | grep -c "^PANVKDBG" || true)
              echo "PANVKDBG strings in freshly built panvk .so: $SO_STRINGS"

              echo "=============================================="
              echo "Listing all built .so files ..."
              echo "=============================================="
              find build-bionic -name "*.so" -o -name "*.so.*" -type f | sort

              # ──────────────────────────────────────────────────────────
              # Package output tree.
              # ──────────────────────────────────────────────────────────
              mkdir -p /termux-out/lib
              mkdir -p /termux-out/share/vulkan/icd.d

              # Copy every .so produced by the build, preserving symlinks.
              # This picks up panvk, zink (in libgallium_dri.so), libEGL,
              # libglapi, and any other shared objects Mesa emitted.
              while IFS= read -r so; do
                cp -a "$so" /termux-out/lib/
              done < <(find build-bionic \( -name "*.so" -o -name "*.so.*" \) -type f)

              # Also copy any .so that were emitted as symlinks only
              while IFS= read -r so; do
                target=$(readlink "$so" || true)
                if [[ -n "$target" ]]; then
                  cp -a "$so" /termux-out/lib/ 2>/dev/null || true
                fi
              done < <(find build-bionic \( -name "*.so" -o -name "*.so.*" \) -type l)

              # Belt-and-braces: explicitly grab the primary artifacts if
              # they exist at their canonical paths.
              for f in \
                build-bionic/src/panfrost/vulkan/libvulkan_panfrost.so \
                build-bionic/src/gallium/targets/dri/libgallium_dri.so \
                build-bionic/src/egl/libEGL.so \
                build-bionic/src/gallium/targets/egl/libEGL_mesa.so \
                build-bionic/src/mapi/shared-glapi/libglapi.so \
                build-bionic/src/glx/libGLX_mesa.so
              do
                [[ -e "$f" ]] && cp -a "$f" /termux-out/lib/ || true
              done

              # ──────────────────────────────────────────────────────────
              # ICD manifest for PanVK. Zink will pick this up through the
              # Vulkan loader when it needs a physical device.
              # ──────────────────────────────────────────────────────────
              cat > /termux-out/share/vulkan/icd.d/panfrost_icd.aarch64.json <<JSON
              {
                  "ICD": {
                      "api_version": "1.4.354",
                      "library_arch": "64",
                      "library_path": "$PREFIX/lib/libvulkan_panfrost.so"
                  },
                  "file_format_version": "1.0.1"
              }
              JSON

              echo "=== ICD ==="
              cat /termux-out/share/vulkan/icd.d/panfrost_icd.aarch64.json
              echo "=== /termux-out tree ==="
              find /termux-out -type f -o -type l | sort
              echo "=== sizes ==="
              ls -lh /termux-out/lib/
            '

      - name: Package tarball (${{ matrix.build-type }})
        run: |
          set -euo pipefail
          cd "termux-out-${{ matrix.build-type }}"
          TARBALL="panvk-zink-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "../${TARBALL}" .
          ls -lh "../${TARBALL}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-zink-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: |
            termux-out-${{ matrix.build-type }}/
            panvk-zink-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — PanVK + Zink for Termux ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body: |
            ## PanVK + Zink for Termux (aarch64, native build)

            Built natively inside Termux (`termux/termux-docker:aarch64`)
            on `ubuntu-24.04-arm` — same toolchain class as an on-device
            native Termux build (Termux Clang/LLD, target
            `aarch64-linux-android35`).

            **Build date (UTC):** `${{ needs.prepare.outputs.date }}`
            **Build time (UTC):** `${{ needs.prepare.outputs.time }}`
            **Commit:** `${{ github.sha }}`
            **Build types:** `${{ needs.prepare.outputs.types }}`

            ### What is included
            - **PanVK** — Vulkan driver for Mali-G57 (Valhall JM) via kbase
            - **Zink** — Gallium driver that provides OpenGL/GLES on top of
              Vulkan. Because Zink translates GL calls to Vulkan and PanVK
              is the Vulkan backend, OpenGL applications running under
              Zink will use PanVK.

            ### Build options
            Meson setup matches the local `build-bionic` script, extended
            with the flags required for Zink:

            ```
            -Dbuildtype=<release|debugoptimized>
            -Dpanvk-use-kbase=true
            -Dvulkan-drivers=panfrost
            -Dgallium-drivers=zink
            -Dplatforms=x11
            -Ddebug=false
            -Dstrip=true
            -Dbuild-tests=false
            -Dc_link_args=-landroid-shmem
            -Dcpp_link_args=-landroid-shmem
            -Dpanfrost-kmds=kbase,panthor
            -Dopengl=true
            -Dgles2=enabled
            -Degl=enabled
            -Dglx=disabled
            -Dgbm=disabled
            -Dshared-glapi=enabled
            -Dlibunwind=disabled
            -Dvalgrind=disabled
            -Dperfetto=false
            -Dprefix=$PREFIX
            ```

            ### Customizations
            - PANVKDBG debug statements are deleted from the source tree
              before compilation, so no format strings or call sites reach
              the binary.
            - Early returns added to the two BO/SHM dump helpers in
              `kbase_kmod.c`.

            ### Files
            - `panvk-zink-termux-aarch64-debugoptimized-*.tar.gz`
            - `panvk-zink-termux-aarch64-release-*.tar.gz`
            - `libvulkan_panfrost.so` — PanVK Vulkan driver
            - `libgallium_dri.so` — contains the Zink Gallium driver
            - `libEGL.so.*`, `libglapi.so.*` — GL/EGL loaders
            - `panfrost_icd.aarch64.json` — ICD manifest for the loader

            ### Install (Termux)
            ```bash
            tar -xzf panvk-zink-termux-aarch64-release-*.tar.gz -C $PREFIX

            # Vulkan: point the loader at PanVK
            export VK_ICD_FILENAMES=$PREFIX/share/vulkan/icd.d/panfrost_icd.aarch64.json

            # Zink: force Mesa to use Zink for OpenGL
            export MESA_LOADER_DRIVER_OVERRIDE=zink
            export GALLIUM_DRIVER=zink
            ```

            ### Verify
            ```bash
            vulkaninfo | grep -i panvk
            glxinfo | grep -i "OpenGL renderer"
            # expect renderer to be "zink (Mali-G57 …)" or similar
            ```
          files: |
            artifacts/*.tar.gz
            artifacts/**/libvulkan_panfrost.so
            artifacts/**/libgallium_dri.so
            artifacts/**/panfrost_icd.aarch64.json
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
