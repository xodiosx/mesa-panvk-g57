name: release PanVK for Termux (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write PANVKDBG patch script
        run: |
          mkdir -p "${{ github.workspace }}/ci-scripts"
          cat > "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py" << 'PYEOF'
          #!/usr/bin/env python3
          """
          Strip PANVKDBG debug overhead from the Mesa fork's source tree.

          Wraps every `fprintf(stderr, "PANVKDBG ...")` call in `if (0)` so
          -O2 / -O3 clang dead-code-eliminates the call and its argument
          evaluation. Also adds an early return to the two BO/SHM dump
          helpers in kbase_kmod.c (SIGBUS source). Idempotent.
          """
          import re
          import sys
          from pathlib import Path

          ROOT = Path("src/panfrost")
          DUMP_HELPERS_FILE = Path("src/panfrost/lib/kmod/kbase_kmod.c")
          DUMP_HELPERS = (
              "kbase_kmod_debug_dump_native_bos",
              "kbase_kmod_debug_dump_user_buffers",
          )

          FPRINTF_RE = re.compile(
              r'(?<!if \(0\) )\bfprintf\s*\(\s*stderr\s*,\s*(?="PANVKDBG)',
          )

          def silence_fprintf(src):
              return FPRINTF_RE.subn("if (0) fprintf(stderr, ", src)

          def early_return(src, func_name):
              pat = re.compile(
                  re.escape(func_name) + r"\s*\([^;{]*?\)\s*\{", re.DOTALL
              )
              m = pat.search(src)
              if not m:
                  return src, False
              brace = src.rfind("{", m.start(), m.end())
              if brace < 0:
                  return src, False
              window = src[brace + 1 : brace + 250]
              if "DEBUG DISABLED" in window:
                  return src, False
              insertion = (
                  "\n   /* DEBUG DISABLED: dump path stripped for performance */\n"
                  "   return;"
              )
              return src[: brace + 1] + insertion + src[brace + 1 :], True

          def main():
              if not ROOT.exists():
                  print(f"ERROR: {ROOT} not found", file=sys.stderr)
                  return 1

              total_calls = 0
              total_files = 0

              for path in sorted(ROOT.rglob("*")):
                  if path.suffix not in (".c", ".h", ".cpp", ".cc", ".cxx", ".hpp"):
                      continue
                  try:
                      src = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if '"PANVKDBG' not in src:
                      continue
                  orig = src
                  src, n = silence_fprintf(src)
                  if n:
                      print(f"{path}: wrapped {n} PANVKDBG call(s)")
                      total_calls += n
                      total_files += 1
                  if src != orig:
                      path.write_text(src)

              if DUMP_HELPERS_FILE.exists():
                  src = DUMP_HELPERS_FILE.read_text()
                  changed = False
                  for fn in DUMP_HELPERS:
                      src, ok = early_return(src, fn)
                      state = "patched" if ok else "skipped (already patched or not found)"
                      print(f"  {state}: {fn}")
                      if ok:
                          changed = True
                  if changed:
                      DUMP_HELPERS_FILE.write_text(src)

              print()
              print(f"Total files modified: {total_files}")
              print(f"Total PANVKDBG calls wrapped: {total_calls}")

              remaining = 0
              for path in ROOT.rglob("*"):
                  if path.suffix not in (".c", ".h", ".cpp", ".cc", ".cxx", ".hpp"):
                      continue
                  try:
                      remaining += path.read_text().count('"PANVKDBG')
                  except UnicodeDecodeError:
                      pass
              print(f"Total \"PANVKDBG string literals in tree: {remaining}")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          chmod +x "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py"
          echo "--- wrote ci-scripts/patch_panvkdbg.py ---"
          wc -l "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py"
          head -5 "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py"

      - name: Build PanVK (${{ matrix.build-type }}) inside Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"
          chmod 777 "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"

          docker run --rm \
            -v "${{ github.workspace }}/termux-out-${{ matrix.build-type }}:/termux-out" \
            -v "${{ github.workspace }}/ci-scripts:/ci-scripts:ro" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
              export BUILD_TYPE="'"${{ matrix.build-type }}"'"

              mkdir -p "$PREFIX/etc/apt/sources.list.d"
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > "$PREFIX/etc/apt/sources.list.d/termux-main.list"

              for i in 1 2 3; do
                if pkg update -y; then
                  break
                fi
                echo "pkg update attempt $i failed, retrying in 10s..."
                sleep 10
                if [[ $i -eq 3 ]]; then
                  echo "pkg update failed after 3 attempts" >&2
                  exit 1
                fi
              done
              pkg install -y x11-repo tur-repo

              pkg install -y \
                git clang lld ninja python python-pip pkg-config \
                bison flex cmake glslang shaderc vulkan-headers \
                vulkan-loader-generic libandroid-shmem libdrm libxcb \
                xorgproto libx11 libxshmfence zlib zstd libexpat \
                libclc spirv-llvm-translator libxrandr libxrandr-static file

              pip install --break-system-packages meson mako pyyaml packaging

              mkdir -p "$TMPDIR"
              cd "$TMPDIR"
              rm -rf mesa-panvk
              git clone --depth 1 https://github.com/xodiosx/mesa-panvk-g57.git mesa-panvk
              cd mesa-panvk

              echo "=============================================="
              echo "Patching PANVKDBG debug calls in source tree ..."
              echo "=============================================="
              if [[ ! -f /ci-scripts/patch_panvkdbg.py ]]; then
                echo "ERROR: /ci-scripts/patch_panvkdbg.py not mounted" >&2
                exit 1
              fi
              python3 /ci-scripts/patch_panvkdbg.py

              echo "=============================================="
              echo "Sanity check: patch actually applied ..."
              echo "=============================================="
              SILENCED=$(grep -r "if (0) fprintf(stderr, \"PANVKDBG" src/panfrost/ | wc -l || true)
              DUMP_GUARDS=$(grep -r "DEBUG DISABLED: dump path stripped" src/panfrost/ | wc -l || true)
              echo "if (0) fprintf sites:    $SILENCED"
              echo "dump-path early returns: $DUMP_GUARDS"
              if [[ "$SILENCED" -lt 100 || "$DUMP_GUARDS" -lt 2 ]]; then
                echo "ERROR: PANVKDBG source patch incomplete." >&2
                echo "Expected >=100 sites and >=2 dump guards." >&2
                exit 1
              fi

              meson setup build-bionic \
                -Dbuildtype="$BUILD_TYPE" \
                -Dvulkan-drivers=panfrost \
                -Dgallium-drivers= \
                -Dpanfrost-kmds=kbase,panthor \
                -Dplatforms=x11 \
                -Dglx=disabled \
                -Degl=disabled \
                -Dopengl=false \
                -Dgles1=disabled \
                -Dgles2=disabled \
                -Dbuild-tests=false \
                -Dlibunwind=disabled \
                -Dvalgrind=disabled \
                -Dperfetto=false \
                -Dpanvk-use-kbase=true \
                -Dprefix="$PREFIX" \
                -Dc_link_args=-landroid-shmem \
                -Dcpp_link_args=-landroid-shmem

              ninja -C build-bionic -j$(nproc) \
                src/panfrost/vulkan/libvulkan_panfrost.so

              mkdir -p /termux-out/lib
              mkdir -p /termux-out/share/vulkan/icd.d

              cp build-bionic/src/panfrost/vulkan/libvulkan_panfrost.so \
                 /termux-out/lib/libvulkan_panfrost.so

              echo "=============================================="
              echo "Verifying PANVKDBG strings are gone from .so ..."
              echo "=============================================="
              PANVKDBG_STRINGS=$(strings /termux-out/lib/libvulkan_panfrost.so \
                                   | grep -c "^PANVKDBG" || true)
              echo "PANVKDBG format strings in binary: $PANVKDBG_STRINGS"

              if [[ "$PANVKDBG_STRINGS" -ne 0 ]]; then
                echo ">>> FAIL: $PANVKDBG_STRINGS PANVKDBG literals survived." >&2
                strings /termux-out/lib/libvulkan_panfrost.so \
                  | grep "PANVKDBG" | head -20 || true
                exit 1
              fi
              echo ">>> PASS: 0 PANVKDBG strings in the binary"

              cat > /termux-out/share/vulkan/icd.d/panfrost_icd.aarch64.json <<JSON
              {
                  "ICD": {
                      "api_version": "1.4.354",
                      "library_arch": "64",
                      "library_path": "$PREFIX/lib/libvulkan_panfrost.so"
                  },
                  "file_format_version": "1.0.1"
              }
              JSON

              echo "=== ICD ==="
              cat /termux-out/share/vulkan/icd.d/panfrost_icd.aarch64.json
              echo "=== /termux-out ==="
              find /termux-out -type f
              echo "=== sizes ==="
              ls -lh /termux-out/lib/
            '

      - name: Package tarball (${{ matrix.build-type }})
        run: |
          set -euo pipefail
          cd "termux-out-${{ matrix.build-type }}"
          TARBALL="panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "../${TARBALL}" .
          ls -lh "../${TARBALL}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: |
            termux-out-${{ matrix.build-type }}/
            panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — PanVK build ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body: |
            ## PanVK for Termux (aarch64, native build)

            Built natively inside Termux (`termux/termux-docker:aarch64`)
            on `ubuntu-24.04-arm` — same toolchain class as an on-device
            native Termux build (Termux Clang/LLD, target
            `aarch64-linux-android35`).

            **Build date (UTC):** `${{ needs.prepare.outputs.date }}`
            **Build time (UTC):** `${{ needs.prepare.outputs.time }}`
            **Commit:** `${{ github.sha }}`
            **Build types:** `${{ needs.prepare.outputs.types }}`

            ### Build customizations
            - PANVKDBG debug output neutralized at the source level by the
              CI itself (before compilation) with `if (0)` wrappers around
              every `fprintf(stderr, "PANVKDBG ...")` call and early returns
              in the two BO/SHM dump helpers. The compiler dead-code-
              eliminates the calls and their argument evaluation at -O2/-O3.

            ### Files
            - `panvk-termux-aarch64-debugoptimized-*.tar.gz`
            - `panvk-termux-aarch64-release-*.tar.gz`
            - `libvulkan_panfrost.so`
            - `panfrost_icd.aarch64.json`

            ### Install (Termux)
            ```bash
            tar -xzf panvk-termux-aarch64-release-*.tar.gz -C $PREFIX
            export VK_ICD_FILENAMES=$PREFIX/share/vulkan/icd.d/panfrost_icd.aarch64.json
            ```
          files: |
            artifacts/*.tar.gz
            artifacts/**/libvulkan_panfrost.so
            artifacts/**/panfrost_icd.aarch64.json
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
