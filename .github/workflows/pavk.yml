name: Build PanVK G57 for Android (AHB + kbase, two-pass)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update'
        required: true
        default: 'panvk-test'
      mesa_branch:
        description: 'Branch of the current repo to build'
        required: true
        default: 'main'
      api_override:
        description: 'Vulkan API override (leave empty to keep as-is)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # ─────────────────────────────────────────────────────────────
      # KEY: libdrm-dev is required. It provides /usr/include/xf86drm.h,
      # /usr/include/xf86drmMode.h, and /usr/include/libdrm/*.h. Without
      # it the Termux sysroot's libdrm.pc is found by pkg-config, but
      # the actual headers are missing, so pan_kmod.c fails on
      # #include <xf86drm.h>.
      # ─────────────────────────────────────────────────────────────
      - name: Install host build tools
        run: |
          sudo apt update
          sudo apt install -y ninja-build pkg-config python3-mako python3-pip \
            glslang-tools flex bison curl ca-certificates cmake \
            clang-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev \
            libclc-19 libclc-19-dev libllvmspirvlib-19-dev \
            libdrm-dev zlib1g-dev libzstd-dev libelf-dev spirv-tools \
            libexpat1-dev
          pip install --user meson==1.4.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download and setup Android NDK (r27c)
        run: |
          NDK_VERSION="r27c"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q ${NDK_ZIP} -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          chmod +x /opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/*

      - name: Setup Termux sysroot (X11 + real Android headers)
        run: |
          mkdir termux && cd termux
          wget -q https://github.com/xodiosx/Wine-arm64ce/releases/download/wine-14/termux-rootfs.tar
          tar xf termux-rootfs.tar
          sudo mv data /data
          sudo chown -R $(whoami):$(whoami) /data
          mkdir -p /data/data/com.termux/files/usr/tmp
          sudo chmod -R a+rX /data/data/com.termux/files/usr

      - name: Provide android_lf.h
        run: |
          NDK_HEADER=$(find /opt/android-ndk-r27c -name android_lf.h -print -quit)
          if [ -n "$NDK_HEADER" ]; then
            sudo cp "$NDK_HEADER" /data/data/com.termux/files/usr/include/
          else
            sudo touch /data/data/com.termux/files/usr/include/android_lf.h
          fi

      - name: Install extra Termux debs
        run: |
          mkdir -p /tmp/debs && cd /tmp/debs
          fetch_deb() {
            local pkg=$1 url=$2
            local file=$(curl -sL "$url" | grep -oE "${pkg}_[^\"<>]+_aarch64\.deb" | head -n 1)
            [ -z "$file" ] && { echo "⚠️ $pkg not found"; return 0; }
            wget -q "${url}${file}" || true
          }
          fetch_deb "libxkbcommon" "https://packages.termux.dev/apt/termux-x11/pool/main/libx/libxkbcommon/" || true
          fetch_deb "libxcb"       "https://packages.termux.dev/apt/termux-main/pool/main/libx/libxcb/" || true
          for deb in *.deb; do
            [ -e "$deb" ] || continue
            dpkg-deb -x "$deb" /tmp/debs/extracted/
          done
          sudo cp -r /tmp/debs/extracted/data/data/com.termux/files/usr/* \
                     /data/data/com.termux/files/usr/ 2>/dev/null || true

      # ─────────────────────────────────────────────────────────────
      # NEW: copy libdrm headers from host libdrm-dev into Termux sysroot.
      # pkg-config finds the Termux libdrm.pc, which advertises
      # -idirafter <termux>/include/libdrm — but the header files
      # themselves aren't there. Copy them so the compile succeeds.
      # ─────────────────────────────────────────────────────────────
      - name: Copy libdrm headers into Termux sysroot
        run: |
          set -euo pipefail
          SYSROOT=/data/data/com.termux/files/usr
          mkdir -p "$SYSROOT/include/libdrm"

          # Flat headers (xf86drm.h, xf86drmMode.h)
          for h in xf86drm.h xf86drmMode.h; do
            if [ -f "/usr/include/$h" ]; then
              sudo cp "/usr/include/$h" "$SYSROOT/include/"
              echo "✔ copied /usr/include/$h"
            else
              echo "⚠️  /usr/include/$h not found on host"
            fi
          done

          # libdrm subdir headers (drm.h, drm_mode.h, drm_fourcc.h, ...)
          if [ -d /usr/include/libdrm ]; then
            sudo cp -a /usr/include/libdrm/*.h "$SYSROOT/include/libdrm/" 2>/dev/null || true
            # Some subdirs (nouveau, etc.) — copy directories too if present
            for sub in /usr/include/libdrm/*/; do
              [ -d "$sub" ] || continue
              sudo cp -a "$sub" "$SYSROOT/include/libdrm/" 2>/dev/null || true
            done
            echo "✔ copied libdrm/*.h"
          fi

          echo "==== sysroot libdrm headers ===="
          ls -la "$SYSROOT/include/xf86drm"* 2>/dev/null || true
          ls -la "$SYSROOT/include/libdrm/" | head -20

      - name: Setup pkg-config wrapper
        run: |
          sudo tee /usr/local/bin/termux-pkg-config > /dev/null << 'SCRIPT'
          #!/bin/bash
          export PKG_CONFIG_PATH=/data/data/com.termux/files/usr/lib/pkgconfig
          /usr/bin/pkg-config "$@" | \
            sed 's|-I/data/data/com.termux/files/usr/include|-idirafter /data/data/com.termux/files/usr/include|g'
          SCRIPT
          sudo chmod +x /usr/local/bin/termux-pkg-config

      - name: Checkout PanVK source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.mesa_branch }}
          path: mesa
          fetch-depth: 1

      - name: Report checked-out commit
        working-directory: mesa
        run: |
          git --no-pager log -1 --oneline
          ls -A | head -40

      - name: Apply essential Termux Bionic patches
        working-directory: mesa
        run: |
          sed -i "s/dependency('libudev',/dependency('libudev', required : false, disabler : true, /g" meson.build
          sed -i "s/has_header('libudev.h')/false/g" meson.build
          curl -sSfL "https://raw.githubusercontent.com/termux/termux-packages/master/packages/mesa/0015-define-reallocarray.patch" | patch -N -p1 || true
          echo "✔ Termux patches applied"

      - name: Inject mock libudev header
        run: |
          sudo tee /data/data/com.termux/files/usr/include/libudev.h > /dev/null << 'EOF'
          #ifndef MOCK_LIBUDEV_H
          #define MOCK_LIBUDEV_H
          #include <pthread.h>
          static inline int pthread_setcanceltype(int t, int *o) { return 0; }
          static inline int pthread_setcancelstate(int s, int *o) { return 0; }
          static inline int pthread_cancel(pthread_t t) { return 0; }
          static inline void pthread_testcancel(void) {}
          struct udev; struct udev_device; struct udev_monitor; struct udev_enumerate;
          static inline struct udev *udev_new(void) { return 0; }
          static inline struct udev *udev_ref(struct udev *u) { return u; }
          static inline void udev_unref(struct udev *u) {}
          static inline struct udev_device *udev_device_new_from_syspath(struct udev *u, const char *p) { return 0; }
          static inline struct udev_device *udev_device_ref(struct udev_device *d) { return d; }
          static inline void udev_device_unref(struct udev_device *d) {}
          static inline const char *udev_device_get_devnode(struct udev_device *d) { return 0; }
          static inline const char *udev_device_get_property_value(struct udev_device *d, const char *p) { return 0; }
          #endif
          EOF

      - name: Inject mock valgrind.h
        run: |
          sudo tee /data/data/com.termux/files/usr/include/valgrind.h > /dev/null << 'EOF'
          #ifndef __MOCK_VALGRIND_H
          #define __MOCK_VALGRIND_H
          #define NVALGRIND 1
          #define RUNNING_ON_VALGRIND 0
          #define VALGRIND_CREATE_MEMPOOL(a, b, c)          ((void)0)
          #define VALGRIND_DESTROY_MEMPOOL(a)               ((void)0)
          #define VALGRIND_MEMPOOL_ALLOC(a, b, c)           ((void)0)
          #define VALGRIND_MEMPOOL_FREE(a, b)               ((void)0)
          #define VALGRIND_MEMPOOL_CHANGE(a, b, c, d)       ((void)0)
          #define VALGRIND_MEMPOOL_EXISTS(a)                0
          #define VALGRIND_MAKE_MEM_DEFINED(a, b)           ((unsigned)0)
          #define VALGRIND_MAKE_MEM_UNDEFINED(a, b)         ((unsigned)0)
          #define VALGRIND_MAKE_MEM_NOACCESS(a, b)          ((unsigned)0)
          #define VALGRIND_MAKE_MEM_DEFINED_IF_ADDRESSABLE(a, b) ((unsigned)0)
          #define VALGRIND_MALLOCLIKE_BLOCK(a, b, c, d)     ((void)0)
          #define VALGRIND_FREELIKE_BLOCK(a, b)             ((void)0)
          #define VALGRIND_RESIZEINPLACE_BLOCK(a, b, c, d)  ((void)0)
          #define VALGRIND_CHECK_MEM_IS_DEFINED(a, b)       ((void)0)
          #define VALGRIND_CHECK_MEM_IS_ADDRESSABLE(a, b)   ((void)0)
          #define VALGRIND_CHECK_VALUE_IS_DEFINED(a)        ((void)0)
          #define VALGRIND_DISCARD_TRANSLATIONS(a, b)       ((void)0)
          #define VALGRIND_DO_LEAK_CHECK                    ((void)0)
          #define VALGRIND_DO_ADDED_LEAK_CHECK              ((void)0)
          #define VALGRIND_DO_CHANGED_LEAK_CHECK            ((void)0)
          #define VALGRIND_DO_NEW_LEAK_CHECK                ((void)0)
          #define VALGRIND_DO_QUICK_LEAK_CHECK              ((void)0)
          #define VALGRIND_COUNT_ERRORS                     0
          #define VALGRIND_COUNT_LEAKS(a, b, c, d)          ((void)0)
          #define VALGRIND_COUNT_LEAK_BLOCKS(a, b, c, d)    ((void)0)
          #define VALGRIND_GET_VBITS(a, b, c)               ((unsigned)0)
          #define VALGRIND_SET_VBITS(a, b, c)               ((unsigned)0)
          #define VALGRIND_PRINTF(...)                      ((void)0)
          #define VALGRIND_PRINTF_BACKTRACE(...)            ((void)0)
          #define VALGRIND_STACK_REGISTER(a, b)             0
          #define VALGRIND_STACK_DEREGISTER(a)              ((void)0)
          #define VALGRIND_STACK_CHANGE(a, b, c)            ((void)0)
          #define VALGRIND_HG_DISABLE_CHECKING(a, b)        ((void)0)
          #define VALGRIND_HG_ENABLE_CHECKING(a, b)         ((void)0)
          #define VALGRIND_CLO_CHANGE(a)                    ((void)0)
          #define __VALGRIND_MAJOR__ 3
          #define __VALGRIND_MINOR__ 22
          #endif
          EOF

      - name: Override Vulkan API version (optional)
        if: github.event.inputs.api_override != ''
        working-directory: mesa
        run: |
          VER="${{ github.event.inputs.api_override }}"
          DEVFILE="src/panfrost/vulkan/panvk_physical_device.c"
          [ -f "$DEVFILE" ] || { echo "❌ $DEVFILE not found"; exit 1; }
          sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${VER//\./_}/" "$DEVFILE" || true

      # ─────────────────────────────────────────────────────────────
      # PASS 1 — Host tools (native x86_64, LLVM 19)
      # ─────────────────────────────────────────────────────────────
      - name: Configure host tools (native)
        working-directory: mesa
        env:
          CC: clang-19
          CXX: clang++-19
          LLVM_CONFIG: /usr/bin/llvm-config-19
        run: |
          meson setup build-host \
            --buildtype=release \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true

      - name: Build host tools (native)
        working-directory: mesa
        env:
          CC: clang-19
          CXX: clang++-19
          LLVM_CONFIG: /usr/bin/llvm-config-19
        run: |
          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile
          find build-host -type f -executable \
            \( -name 'mesa_clc' -o -name 'vtn_bindgen2' -o -name 'panfrost_compile' \) -print

      - name: Stage host tools on PATH (dashed + underscored)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/host-bin"
          for name in mesa_clc vtn_bindgen2 panfrost_compile; do
            bin=$(find "$GITHUB_WORKSPACE/mesa/build-host" -type f -executable -name "$name" | head -n1)
            if [ -z "$bin" ]; then
              echo "❌ $name not found in build-host"
              exit 1
            fi
            dashed=$(echo "$name" | tr '_' '-')
            cp "$bin" "$GITHUB_WORKSPACE/host-bin/$name"
            cp "$bin" "$GITHUB_WORKSPACE/host-bin/$dashed"
            echo "✔ staged $name -> $dashed"
          done
          ls -la "$GITHUB_WORKSPACE/host-bin/"
          echo "$GITHUB_WORKSPACE/host-bin" >> "$GITHUB_PATH"

      # ─────────────────────────────────────────────────────────────
      # PASS 2 — Cross build for aarch64-linux-android
      # ─────────────────────────────────────────────────────────────
      - name: Create Meson cross file
        run: |
          TARGET="aarch64-linux-android"
          API=29
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > ~/cross_file.txt << EOF
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [binaries]
          c = '${NDK_BIN}/${TARGET}${API}-clang'
          cpp = '${NDK_BIN}/${TARGET}${API}-clang++'
          ar = '${NDK_BIN}/llvm-ar'
          strip = '${NDK_BIN}/llvm-strip'
          pkg-config = 'termux-pkg-config'

          [properties]
          needs_exe_wrapper = true
          EOF
          cat ~/cross_file.txt

      - name: Configure PanVK (cross, uses host CLC)
        run: |
          meson setup build mesa \
            --cross-file ~/cross_file.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=29 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dpanfrost-kmds=kbase,panthor \
            -Dpanvk-use-kbase=true \
            -Dllvm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dshader-cache=disabled \
            -Dxmlconfig=disabled \
            -Dexpat=disabled \
            -Dlibunwind=disabled \
            -Dzstd=disabled \
            -Dvideo-codecs= \
            -Dperfetto=false \
            -Dprefix=/usr \
            -Dstrip=true

      - name: Build PanVK ICD
        env:
          PATH: ${{ github.workspace }}/host-bin:/usr/lib/llvm-19/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          ninja -C build src/panfrost/vulkan/libvulkan_panfrost.so

      - name: Package PanVK artifact
        run: |
          set -euo pipefail
          mkdir -p panvk_out/lib panvk_out/share/vulkan/icd.d

          SO=$(find build/src/panfrost/vulkan -maxdepth 1 -name 'libvulkan_panfrost.so' -print -quit)
          if [ -z "$SO" ]; then
            echo "❌ libvulkan_panfrost.so not found"
            find build/src/panfrost/vulkan -maxdepth 1 -type f
            exit 1
          fi

          ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            --strip-unneeded -o panvk_out/lib/libvulkan_panfrost.so "$SO"

          cat > panvk_out/share/vulkan/icd.d/panfrost_icd.aarch64.json <<'JSON'
          {
              "file_format_version": "1.0.1",
              "ICD": {
                  "library_path": "libvulkan_panfrost.so",
                  "api_version": "1.3.0",
                  "library_arch": "64"
              }
          }
          JSON

          ls -lh panvk_out/lib/
          tar -cJf panvk-${{ github.event.inputs.mesa_branch }}-aarch64.tar.xz -C panvk_out .
          ls -lh panvk-*.tar.xz

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-build-logs
          path: |
            build/meson-logs/
            mesa/build-host/meson-logs/
          if-no-files-found: ignore

      - name: Upload release assets
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            panvk-*.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
