name: PanVK G57 - WinlatorMali Android candidate

on:
  workflow_dispatch:
  push:
    branches: [winlator-pan]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: 28.2.13676358
      ANDROID_API: '35'
      BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkgconf bison flex ripgrep \
            clang-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev \
            libclc-19 libclc-19-dev libllvmspirvlib-19-dev libdrm-dev \
            zlib1g-dev python3-venv patchelf
          python3 -m venv .ci-python
          .ci-python/bin/pip install meson==1.8.3 Mako==1.3.10 \
            packaging==25.0 PyYAML==6.0.2 ply==3.11
          echo "$GITHUB_WORKSPACE/.ci-python/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" "ndk;$NDK_VERSION"
          echo "PANVK_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # ──────────────────────────────────────────────────────────
      # Patch 1: disable local-sources sha256 check in build.sh.
      # ──────────────────────────────────────────────────────────
      - name: Patch build.sh (disable sha256 check)
        run: |
          set -euo pipefail
          BUILD=".github/winlatormali/build.sh"
          [[ -f "$BUILD" ]] || { echo "ERROR: $BUILD not found"; exit 1; }
          sed -i -E \
            's|^([[:space:]]*)sha256sum[[:space:]]+-c[[:space:]]+[^[:space:]]*local-sources\.sha256.*$|\1# [CI-disabled] sha256 check removed|' \
            "$BUILD"
          rm -f .github/winlatormali/local-sources.sha256
          grep -n 'sha256sum' "$BUILD" || echo "  (none remaining)"

      # ──────────────────────────────────────────────────────────
      # Patch 2: NDK 28 compat for panvk_android.c.
      # ──────────────────────────────────────────────────────────
      - name: Patch panvk_android.c (NDK 28 compat)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          path = "src/panfrost/vulkan/panvk_android.c"
          try:
              src = open(path, encoding="utf-8").read()
          except FileNotFoundError:
              print(f"ERROR: {path} not found", file=sys.stderr); sys.exit(1)

          if "/* CI: trace dump disabled" in src:
              print("Already patched — skipping."); sys.exit(0)

          start = src.find("panvk_android_ahb_trace_dump")
          if start == -1:
              print("WARNING: helper not found; nothing to do."); sys.exit(0)

          brace = src.find("{", start)
          depth = 0; i = brace
          in_str = in_chr = False
          in_line = in_block = False
          while i < len(src):
              c = src[i]; nxt = src[i+1] if i+1 < len(src) else ""
              if in_line:
                  if c == "\n": in_line = False
              elif in_block:
                  if c == "*" and nxt == "/": in_block = False; i += 1
              elif in_str:
                  if c == "\\": i += 1
                  elif c == '"': in_str = False
              elif in_chr:
                  if c == "\\": i += 1
                  elif c == "'": in_chr = False
              else:
                  if c == "/" and nxt == "/": in_line = True; i += 1
                  elif c == "/" and nxt == "*": in_block = True; i += 1
                  elif c == '"': in_str = True
                  elif c == "'": in_chr = True
                  elif c == "{": depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0: break
              i += 1

          if depth != 0:
              print("ERROR: brace match failed.", file=sys.stderr); sys.exit(1)

          replacement = (
              "{\n"
              "   /* CI: trace dump disabled for NDK 28 — uses APIs not in\n"
              "    * android/hardware_buffer.h. Debug-only, gated on\n"
              "    * PANVK_AHB_TRACE=1, so this stub is a no-op. */\n"
              "   (void)tag; (void)ahb; (void)img; (void)layout;\n"
              "   return;\n"
              "}"
          )
          new_src = src[:brace] + replacement + src[i+1:]
          open(path, "w", encoding="utf-8").write(new_src)
          print(f"Patched {path}.")
          PY

      # ──────────────────────────────────────────────────────────
      # Patch 3: build wsi_common_android.c under android-stub.
      # The reference's meson condition has `not with_android_stub`,
      # which excludes the file while wsi_common.c still calls it.
      # ──────────────────────────────────────────────────────────
      - name: Patch wsi/meson.build (build wsi_common_android.c)
        run: |
          set -euo pipefail
          FILE="src/vulkan/wsi/meson.build"
          [[ -f "$FILE" ]] || { echo "ERROR: $FILE not found"; exit 1; }
          sed -i -E \
            's|if with_platform_android and not with_android_stub and get_option|if with_platform_android and get_option|' \
            "$FILE"
          if grep -qE 'not with_android_stub' "$FILE"; then
            echo "ERROR: substitution failed"; exit 1
          fi
          grep -n 'wsi_common_android.c' "$FILE" || { echo "ERROR: android WSI missing"; exit 1; }
          echo "OK: $FILE patched"

      # ──────────────────────────────────────────────────────────
      # Patch 4: fix wsi_common_android.c so it compiles against
      # the android-stub headers. Three problems:
      #   - missing util/os_time.h include (timespec_from_nsec)
      #   - VkSurfaceCapabilities2KHR accesses need .surfaceCapabilities
      #   - ANativeWindow_lock signature differs from the stub
      # ──────────────────────────────────────────────────────────
      - name: Patch wsi_common_android.c for stub compatibility
        run: |
          set -euo pipefail
          FILE="src/vulkan/wsi/wsi_common_android.c"
          [[ -f "$FILE" ]] || { echo "ERROR: $FILE not found"; exit 1; }

          # ---- fix 1: add util/os_time.h include before wsi_common_queue.h ----
          if ! grep -q '#include "util/os_time.h"' "$FILE"; then
            python3 - "$FILE" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          needle = '#include "wsi_common_queue.h"'
          if needle not in src:
              print("WARN: wsi_common_queue.h include not found; skipping include fix")
              sys.exit(0)
          src = src.replace(needle,
                            '#include "util/os_time.h"\n' + needle, 1)
          open(p, "w", encoding="utf-8").write(src)
          print("Inserted util/os_time.h include")
          PY
          fi

          # ---- fix 2: VkSurfaceCapabilities2KHR member accesses ----
          for m in minImageCount maxImageCount currentExtent \
                   minImageExtent maxImageExtent maxImageArrayLayers \
                   supportedTransforms currentTransform supportedCompositeAlpha; do
            sed -i "s|pSurfaceCapabilities->${m}\\b|pSurfaceCapabilities->surfaceCapabilities.${m}|g" "$FILE"
          done

          echo "---- remaining direct pSurfaceCapabilities-> accesses ----"
          grep -n 'pSurfaceCapabilities->' "$FILE" || true

          # ---- fix 3: rewrite wsi_android_lock_image to match the stub ----
          python3 - "$FILE" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()

          if "/* CI: lock_image rewritten for android-stub" in src:
              print("lock_image already rewritten — skipping")
              sys.exit(0)

          marker = "wsi_android_lock_image"
          start = src.find(marker)
          if start == -1:
              print(f"WARNING: {marker} not found")
              sys.exit(0)

          brace = src.find("{", start)
          if brace == -1:
              print("WARNING: opening brace not found")
              sys.exit(0)

          depth = 0; i = brace
          in_str = in_chr = False
          in_line = in_block = False
          while i < len(src):
              c = src[i]; nxt = src[i+1] if i+1 < len(src) else ""
              if in_line:
                  if c == "\n": in_line = False
              elif in_block:
                  if c == "*" and nxt == "/": in_block = False; i += 1
              elif in_str:
                  if c == "\\": i += 1
                  elif c == '"': in_str = False
              elif in_chr:
                  if c == "\\": i += 1
                  elif c == "'": in_chr = False
              else:
                  if c == "/" and nxt == "/": in_line = True; i += 1
                  elif c == "/" and nxt == "*": in_block = True; i += 1
                  elif c == '"': in_str = True
                  elif c == "'": in_chr = True
                  elif c == "{": depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0: break
              i += 1

          if depth != 0:
              print("ERROR: brace match failed in lock_image", file=sys.stderr)
              sys.exit(1)

          replacement = """{
             /* CI: lock_image rewritten for android-stub.
              *
              * The stub's ANativeWindow_lock signature is
              *   int32_t(ANativeWindow*, ANativeWindow_Buffer*, ARect*)
              * while the reference was written against a different shape.
              * This version matches the stub headers, which in turn match
              * the real Android API. */
             struct ANativeWindow *window = image->window;
             int32_t width, height;
             ARect in_rect;
             ANativeWindow_Buffer out_buffer;
             uint8_t *ptr;
             int32_t lock_rc;

             if (!window || image->locked)
                return false;

             width = ANativeWindow_getWidth(window);
             height = ANativeWindow_getHeight(window);
             if (width <= 0 || height <= 0)
                return false;

             in_rect.left = 0;
             in_rect.top = 0;
             in_rect.right = width;
             in_rect.bottom = height;
             memset(&out_buffer, 0, sizeof(out_buffer));

             lock_rc = ANativeWindow_lock(window, &out_buffer, &in_rect);
             if (lock_rc != 0)
                return false;

             ptr = (uint8_t *)out_buffer.bits;
             if (!ptr || out_buffer.width <= 0 || out_buffer.height <= 0) {
                ANativeWindow_unlockAndPost(window);
                return false;
             }

             image->buffer_ptr = ptr;
             image->buffer_stride = (uint32_t)out_buffer.stride * 4;
             image->locked = true;

             if (wsi_panvk_trace())
                fprintf(stderr,
                        "PANVKDBG ANDROID_LOCK image=%p ptr=%p stride=%u "
                        "out=%dx%d want=%u\\n",
                        (void *)image, (void *)ptr, image->buffer_stride,
                        out_buffer.width, out_buffer.height, size);

             return true;
          }"""

          new_src = src[:brace] + replacement + src[i+1:]
          open(p, "w", encoding="utf-8").write(new_src)
          print(f"Rewrote {marker} body in {p}.")
          PY

          echo "---- verification: lock_image head ----"
          grep -n -A8 'wsi_android_lock_image' "$FILE" | head -20

      - name: Build host tools and Android driver
        run: bash .github/winlatormali/build.sh

      - name: Validate ELF and create driver ZIP
        run: python3 .github/winlatormali/package.py

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G57-WinlatorMali-candidate
          path: out-winlatormali/
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G57-WinlatorMali-build-logs
          path: |
            build-winlatormali-native/meson-logs/
            build-winlatormali-android/meson-logs/
            ci-winlatormali/build.log
            ci-winlatormali/provenance.txt
          if-no-files-found: ignore
